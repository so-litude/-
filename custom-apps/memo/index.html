<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>备忘录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #f0f5ff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: #1a2a3a;
      font-size: 15px;
    }
    .app {
      min-height: 100dvh;
      padding: calc(var(--ai-phone-app-safe-top, 88px) + 12px) 16px var(--ai-phone-app-safe-bottom, 24px);
      max-width: 480px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #d0e0ff;
      margin-bottom: 12px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .header-left { display: flex; align-items: center; gap: 6px; }
    .header h1 { font-size: 20px; font-weight: 600; color: #1a3a6a; }
    .header .gear-btn {
      background: none; border: none;
      font-size: 18px; cursor: pointer;
      color: #6a8aaa; padding: 0 4px;
    }
    .header .gear-btn:active { color: #2a5a8a; transform: rotate(60deg); }
    .header-right {
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap; justify-content: flex-end;
    }
    .header .friend-badge {
      font-size: 11px; color: #4a7ab5; background: #e5f0ff;
      padding: 2px 10px; border-radius: 14px; border: 1px solid #b8d0f0;
      cursor: pointer; white-space: nowrap;
    }
    .header .btn-import-top {
      padding: 2px 10px; border: 1px solid #b0cce5; border-radius: 14px;
      background: #fff; color: #2a5a8a; font-size: 11px;
      cursor: pointer; white-space: nowrap; min-height: 26px;
    }
    .header .header-recycle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 10px;
      border: 1px solid #c8ddf5;
      border-radius: 14px;
      background: rgba(255,255,255,0.6);
      color: #6a8aaa;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 26px;
      line-height: normal;
    }
    .header .header-recycle:active { background: #e5effa; }

    .search-area { margin-bottom: 10px; }
    .search-area input {
      width: 100%; padding: 6px 14px;
      border: 1px solid #c8ddf5; border-radius: 20px;
      font-size: 14px; background: #fff;
      outline: none;
    }
    .search-area input:focus { border-color: #4a8ad0; }

    .tabs {
      display: flex;
      border-bottom: 2px solid #dce8f5;
      margin-bottom: 10px;
    }
    .tabs button {
      flex: 1; background: transparent; border: none;
      padding: 6px 0; font-size: 14px; font-weight: 500;
      color: #6a8aaa; cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tabs button.active {
      color: #1a4a7a; border-bottom-color: #2a6ac8; font-weight: 600;
    }

    .memo-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 80px; }

    .memo-card {
      background: #fff; border: 1px solid #c8ddf5; border-radius: 12px;
      padding: 12px 14px; width: 100%;
      cursor: default;
    }
    .memo-card.special { background: #ebf5ff; border-color: #9ac0e8; }
    .memo-card.daibi { background: #fff; border: 2px solid #2a6ac8; }
    .memo-card.locked {
      border: 2px solid #1a3a6a;
      background: #f5f8ff;
    }

    .memo-card .memo-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; margin-bottom: 2px;
    }
    .memo-card .memo-time { font-size: 10px; color: #6a8aaa; white-space: nowrap; }
    .memo-card .memo-top-right {
      display: flex; align-items: center; gap: 3px; flex-shrink: 0; flex-wrap: wrap;
    }
    .memo-card .badge {
      font-size: 9px; padding: 0 6px; border-radius: 8px;
      background: #e5effa; color: #2a5a7a; border: 1px solid #c0d8f0;
      cursor: default; user-select: none; line-height: 18px;
    }
    .memo-card .badge-encrypted {
      background: #2a4a7a; color: #fff; border-color: #1a3a6a;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .memo-card .badge-encrypted.inactive {
      background: #d4dce8; color: #3a4a5a; border-color: #b0c0d0;
    }
    .memo-card .badge-special { background: #b8d8f5; color: #1a3a6a; border-color: #7ab0d8; }
    .memo-card .badge-reply { background: #d4e8f5; color: #1a4a6a; border-color: #8ab8d8; }
    .memo-card .badge-daibi { background: #2a6ac8; color: #fff; border-color: #1a4a9a; }
    .memo-card .badge-daibi-name {
      background: #2a6ac8; color: #fff; border-color: #1a4a9a;
      font-weight: 600;
    }
    .memo-card .badge-unknown {
      background: #e8e0d0; color: #6a5a4a; border-color: #c8b8a0;
      cursor: pointer;
    }
    .memo-card .badge-unknown.revealed {
      background: #d0e5ff; color: #1a4a7a; border-color: #7ab0d8;
      cursor: default;
    }
    .memo-card .badge-lock {
      font-size: 9px; padding: 0 6px; border-radius: 8px;
      background: #e5effa; color: #8aaac8; border: 1px solid #c0d8f0;
      cursor: pointer; user-select: none; line-height: 18px;
    }
    .memo-card .badge-lock.active {
      background: #2a4a7a; color: #fff; border-color: #1a3a6a;
    }

    .memo-card .memo-title {
      font-size: 17px;
      font-weight: 600;
      color: #084584;
      line-height: 1.4;
      margin: 2px 0 1px 0;
      word-break: break-word;
    }
    .memo-card .memo-content {
      font-size: 14px;
      line-height: 1.5;
      margin: 1px 0 4px 0;
      word-break: break-word;
      color: #1a2a3a;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }
    .memo-card .memo-thumbs {
      display: flex; gap: 6px; margin: 6px 0 2px 0; overflow-x: auto;
      padding-bottom: 2px;
    }
    .memo-card .memo-thumb {
      flex-shrink: 0; width: 60px; height: 60px;
      border: 2px solid #1a3a6a; border-radius: 8px; overflow: hidden;
      background: #eef4fb;
    }
    .memo-card .memo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .memo-card .memo-thumb .thumb-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      color: #8aaac8; font-size: 11px;
    }

    .memo-card .memo-bottom {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid #e5eef8; padding-top: 6px; margin-top: 2px;
      flex-wrap: wrap; gap: 4px;
    }
    .memo-card .memo-actions { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
    .memo-card .memo-actions .btn { font-size: 10px; padding: 1px 8px; min-height: 22px; }

    .btn {
      padding: 4px 12px; border: none; border-radius: 14px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      min-height: 30px; border: 1px solid transparent;
      background: #eaf2fa; color: #2a4a6a;
    }
    .btn-primary { background: #2a6ac8; color: #fff; }
    .btn-primary:active { background: #1a4a9a; }
    .btn-outline { background: transparent; border: 1px solid #b0cce5; }
    .btn-outline:active { background: #e5effa; }
    .btn-danger { background: #d94a4a; color: #fff; }
    .btn-danger:active { background: #b03030; }
    .btn-sm { font-size: 10px; padding: 1px 8px; min-height: 22px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .favorite-star {
      cursor: pointer; font-size: 16px; color: #b0c8e0;
      background: none; border: none; padding: 0 2px;
    }
    .favorite-star.active { color: #f5b342; }

    .edit-history-btn {
      font-size: 14px;
      border: none;
      background: transparent;
      padding: 0 2px;
      cursor: pointer;
    }
    .edit-history-btn.disabled {
      color: #b0c8e0;
      cursor: default;
    }

    .reply-expand {
      margin-top: 6px; padding-top: 6px; border-top: 1px dashed #c8ddf5;
    }
    .reply-item {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 4px 0; border-bottom: 1px solid #eef4fa;
    }
    .reply-item:last-child { border-bottom: none; }
    .reply-item .reply-body { flex: 1; min-width: 0; }
    .reply-item .reply-name {
      font-size: 11px; font-weight: 600; color: #2a4a6a;
    }
    .reply-item .reply-name .reply-time {
      font-weight: 400; color: #8aaac8; font-size: 10px; margin-left: 4px;
    }
    .reply-item .reply-text { font-size: 13px; color: #1a2a3a; line-height: 1.4; word-break: break-word; }
    .reply-item .reply-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .reply-item .reply-actions .btn { font-size: 9px; padding: 0 6px; min-height: 20px; }

    .fab {
      position: fixed;
      bottom: calc(var(--ai-phone-app-safe-bottom, 24px) + 24px);
      right: 24px;
      width: 52px; height: 52px; border-radius: 50%;
      background: #2a6ac8; color: #fff;
      border: none; font-size: 28px; font-weight: 300;
      box-shadow: 0 6px 20px rgba(42,106,200,0.35);
      cursor: pointer; z-index: 50;
      display: flex; align-items: center; justify-content: center;
    }
    .fab:active { transform: scale(0.92); }

    .empty-state { text-align: center; color: #8aaac8; padding: 30px 0 20px; font-size: 14px; }

    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: #1a2a4a; color: #f0f7ff; padding: 10px 28px;
      border-radius: 30px; font-size: 14px; z-index: 3000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
      max-width: 92%; text-align: center; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .toast.wrap { white-space: normal; }

    .error-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 3001; padding: 30px;
    }
    .error-box {
      background: #fff5f5; border-radius: 16px; max-width: 380px; width: 100%;
      padding: 20px; border: 1px solid #e8b0b0;
    }
    .error-box h3 { color: #b03030; font-size: 17px; margin-bottom: 8px; }
    .error-box p { color: #3a2a2a; font-size: 14px; line-height: 1.6; margin-bottom: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .error-box .btn { width: 100%; background: #b03030; color: #fff; border: none; padding: 10px; border-radius: 10px; font-size: 15px; cursor: pointer; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,30,60,0.4); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .modal-overlay.topmost { z-index: 2600; }
    .modal-box {
      background: #fff; border-radius: 16px; max-width: 400px; width: 100%;
      padding: 20px; border: 1px solid #c8ddf5;
      box-shadow: 0 12px 40px rgba(0,20,50,0.15);
    }
    .modal-box h3 { font-size: 17px; color: #1a3a6a; margin-bottom: 8px; }
    .modal-box textarea, .modal-box input[type="datetime-local"] {
      width: 100%; padding: 8px 12px; border: 1px solid #d0dff0;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      margin-bottom: 10px; background: #fafcff;
    }
    .modal-box textarea { min-height: 70px; resize: vertical; }
    .modal-box .modal-actions {
      display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px;
    }
    .modal-box .modal-actions .btn { min-width: 56px; }
    .hidden { display: none !important; }

    .dev-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,30,60,0.5); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000; padding: 20px;
    }
    .dev-panel {
      background: #fff; border-radius: 20px; max-width: 400px; width: 100%;
      padding: 20px; border: 1px solid #c8ddf5;
      box-shadow: 0 16px 48px rgba(10,30,60,0.2);
      margin-top: calc(var(--ai-phone-app-safe-top, 88px) * 0.5);
      max-height: 78vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .dev-panel .dev-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    .dev-panel .dev-header h3 { font-size: 17px; color: #1a3a6a; margin: 0; }
    .dev-panel .dev-close { background: none; border: none; font-size: 22px; color: #8aaac8; cursor: pointer; }
    .dev-panel .dev-group { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e5eef8; }
    .dev-panel .dev-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .dev-panel .dev-group-title {
      font-size: 13px; font-weight: 600; color: #2a4a6a; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .dev-panel .dev-group-title .dev-reset-small {
      font-size: 11px; font-weight: 400; color: #5a7a9a;
      background: #eaf2fa; border: 1px solid #c0d8f0;
      border-radius: 10px; padding: 1px 10px;
      cursor: pointer; min-height: 22px;
    }
    .dev-panel .dev-group-title .dev-reset-small:active { background: #dce6f2; }
    .dev-panel .dev-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 3px;
    }
    .dev-panel .dev-row label {
      display: flex; align-items: center; gap: 4px; font-size: 12px; color: #3a5a7a;
      cursor: pointer;
    }
    .dev-panel .dev-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #3a7ac8; }
    .dev-panel .dev-row input[type="number"] {
      width: 50px; padding: 2px 4px; border: 1px solid #d0dff0; border-radius: 4px;
      font-size: 12px; text-align: center; background: #fafcff;
    }
    .dev-panel .dev-row input[type="number"]:disabled { background: #f0f4fa; color: #8aaac8; }
    .dev-panel .dev-row .dev-label { font-size: 11px; color: #5a7a9a; }
    .dev-panel .dev-row .dev-btn-gen {
      padding: 2px 14px; border: none; border-radius: 12px;
      background: #2a6ac8; color: #fff; font-size: 12px;
      cursor: pointer; min-height: 26px;
    }
    .dev-panel .dev-row .dev-btn-gen:active { background: #1a4a9a; }
    .dev-panel .dev-actions {
      display: flex; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5eef8;
    }
    .dev-panel .dev-actions .btn { flex: 1; padding: 6px; border-radius: 10px; font-size: 12px; text-align: center; }
    .dev-panel .dev-actions .btn-close-panel { background: #2a6ac8; color: #fff; }

    .friend-select-list {
      display: flex; flex-direction: column; gap: 4px; margin: 8px 0; max-height: 160px; overflow-y: auto;
    }
    .friend-select-list button {
      padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #f8fafc; text-align: left; font-size: 13px; cursor: pointer; min-height: 34px;
    }
    .friend-select-list button:active { background: #e2e8f0; }

    .recycle-list {
      display: flex; flex-direction: column; gap: 4px; margin: 8px 0; max-height: 200px; overflow-y: auto;
    }
    .recycle-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-bottom: 1px solid #eef4fa;
      font-size: 13px;
    }
    .recycle-item .recycle-content {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .recycle-item .recycle-time {
      font-size: 10px; color: #8aaac8; margin: 0 8px;
    }
    .recycle-item .recycle-actions { display: flex; gap: 4px; }
    .recycle-item .recycle-actions .btn {
      font-size: 9px; padding: 0 6px; min-height: 20px;
    }

    .curious-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,30,60,0.5); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1500; padding: 20px;
    }
    .curious-panel {
      background: #fff; border-radius: 20px; width: 80%; max-width: 400px;
      padding: 18px; border: 1px solid #c8ddf5;
      box-shadow: 0 16px 48px rgba(10,30,60,0.25);
      display: flex; flex-direction: column; gap: 10px;
    }
    .curious-panel .curious-body {
      display: flex; gap: 12px; align-items: center; min-height: 44px;
    }
    .curious-panel .curious-name-box {
      flex-shrink: 0; text-align: center;
      padding: 4px 12px; border: 2px solid #b8d8f5; border-radius: 10px;
      background: #f5faff; min-width: 50px;
    }
    .curious-panel .curious-name-box .name {
      font-size: 14px; font-weight: 600; color: #1a4a7a;
    }
    .curious-panel .curious-text {
      flex: 1; font-size: 14px; line-height: 1.5; color: #1a2a3a; word-break: break-word;
    }
    .curious-panel .curious-actions {
      display: flex; gap: 10px; justify-content: center; padding-top: 6px; border-top: 1px solid #e5eef8;
    }
    .curious-panel .curious-actions .btn { min-width: 64px; }
    .curious-panel .curious-actions .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .reading-progress {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #fff; border: 1px solid #c8ddf5; border-radius: 14px;
      padding: 14px 20px; max-width: 340px; width: 90%; z-index: 1500;
      box-shadow: 0 8px 32px rgba(10,30,60,0.2); text-align: center;
    }
    .reading-progress .progress-text { font-size: 13px; color: #2a4a6a; margin-bottom: 6px; }
    .reading-progress .progress-bar { width: 100%; height: 4px; background: #e5effa; border-radius: 2px; overflow: hidden; }
    .reading-progress .progress-bar .fill { height: 100%; background: #2a6ac8; width: 0%; transition: width 0.1s linear; border-radius: 2px; }

    .reply-detail-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,30,60,0.5); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1600; padding: 20px;
    }
    .reply-detail-panel {
      background: #fff; border-radius: 20px; width: 85%; max-width: 400px;
      padding: 18px; border: 1px solid #c8ddf5;
      box-shadow: 0 16px 48px rgba(10,30,60,0.25);
    }
    .reply-detail-panel .rd-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .reply-detail-panel .rd-header .rd-name {
      font-size: 15px; font-weight: 600; color: #1a3a6a;
    }
    .reply-detail-panel .rd-header .rd-actions { display: flex; gap: 4px; }
    .reply-detail-panel .rd-header .rd-actions .btn {
      font-size: 10px; padding: 1px 8px; min-height: 22px;
      border: none; border-radius: 12px; background: #eaf2fa; color: #2a4a6a; cursor: pointer;
    }
    .reply-detail-panel .rd-header .rd-actions .btn-danger-sm { background: #f5e0e0; color: #b03030; }
    .reply-detail-panel .rd-content {
      font-size: 14px; line-height: 1.6; color: #1a2a3a;
      padding: 6px 0 10px; border-bottom: 1px solid #e5eef8;
      min-height: 40px; word-break: break-word;
    }
    .reply-detail-panel .rd-footer {
      display: flex; gap: 8px; justify-content: flex-end; padding-top: 10px;
    }
    .reply-detail-panel .rd-footer .btn { min-width: 56px; }
    .reply-detail-panel .rd-footer .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .share-target-list {
      display: flex; flex-direction: column; gap: 4px; margin: 8px 0; max-height: 160px; overflow-y: auto;
    }
    .share-target-list button {
      padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #f8fafc; text-align: left; font-size: 13px; cursor: pointer; min-height: 34px;
    }
    .share-target-list button:active { background: #e2e8f0; }

    .file-input-hidden { display: none; }

    .guess-list {
      display: flex; flex-direction: column; gap: 4px; margin: 8px 0; max-height: 130px; overflow-y: auto;
    }
    .guess-list button {
      padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #f8fafc; text-align: left; font-size: 13px; cursor: pointer; min-height: 32px;
    }
    .guess-list button:active { background: #e2e8f0; }

    .msg-notification-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,30,60,0.3); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1700; padding: 30px;
    }
    .msg-notification-box {

<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-left">

      <button class="gear-btn" id="gearBtn">⚙️</button>
    </div>
    <div class="header-right">

  </div>

  <div class="search-area">

</div>

<!-- 调试工具 -->
<div class="dev-overlay hidden" id="devOverlay">
  <div class="dev-panel">
    <div class="dev-header" style="display:flex; align-items:center; justify-content:space-between;">

      <div class="dev-group-title">角色留言</div>

      </div>

        <span class="dev-label">每日条数</span>
        <input type="number" id="devSpecialCount" value="1" min="0" max="10">
        <span class="dev-value">条/天</span>
      </div>
      <div class="dev-row">

      </div>

        <button class="dev-btn-gen" id="devSpecialCharsBtn">选择角色</button>
        <button class="dev-btn-gen" id="devSpecialCharsClear" style="background:#8a4a4a;">清空</button>
      </div>
    </div>
    <div class="dev-group">
      <div class="dev-group-title">角色回复</div>
      <div class="dev-row">
        <label><input type="checkbox" id="devReplyEnabled" checked> 启用角色回复（每日随机 + 调试生成）</label>
      </div>
      <div class="dev-row">
        <span class="dev-label">每日条数</span>
        <input type="number" id="devReplyCount" value="1" min="0" max="10">
        <span class="dev-value">条/天</span>
      </div>
      <div class="dev-row">
        <button class="dev-btn-gen" id="devReplyGen">生成 1 条</button>
      </div>
      <div class="dev-row">
        <span class="dev-label">指定角色：</span>
        <span class="dev-label" id="devReplyCharsLabel" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">全部角色</span>
      </div>
      <div class="dev-row">
        <button class="dev-btn-gen" id="devReplyCharsBtn">选择角色</button>
        <button class="dev-btn-gen" id="devReplyCharsClear" style="background:#8a4a4a;">清空</button>
      </div>
    </div>
<div class="dev-group">
  <div class="dev-group-title">
    <span>好奇机制</span>
  </div>
  <div class="dev-row">
    <span class="dev-label">触发概率</span>
    <input type="number" id="devCuriousProb" value="50" min="0" max="100">
    <span class="dev-value">%</span>
  </div>
  <div class="dev-row">
    <span class="dev-label">放弃概率</span>
    <input type="number" id="devRefuseGiveupProb" value="70" min="0" max="100">
    <span class="dev-value">%</span>
  </div>
  <div class="dev-row">
    <span class="dev-label">放弃消息概率</span>
    <input type="number" id="devGiveupProb" value="30" min="0" max="100">
    <span class="dev-value">%</span>
  </div>
  <div class="dev-row">
    <span class="dev-label">好奇对象</span>
    <label><input type="checkbox" id="devCuriousEncrypted" checked> 加密</label>

  <div class="dev-row">
    <label><input type="checkbox" id="devCuriousSendMsg" checked> 好奇同意后主动发消息</label>
  </div>
</div>
    <div class="dev-group">
      <div class="dev-group-title">好奇机制 · 强制同意（二选一）</div>
      <div class="dev-row">
        <label><input type="radio" name="forceMode" id="devForceProbMode"> 概率触发</label>
        <span class="dev-label">概率</span>
        <input type="number" id="devForceProb" value="100" min="0" max="100" disabled>
        <span class="dev-value">%</span>
      </div>
      <div class="dev-row">
        <label><input type="radio" name="forceMode" id="devForceCondMode" checked> 条件触发</label>
        <span style="font-size:11px;color:#5a7a9a;">（三选二+</span>
        <input type="number" id="devForceRollProb" value="10" min="0" max="100" style="width:50px;padding:2px 4px;border:1px solid #d0dff0;border-radius:4px;font-size:12px;text-align:center;background:#fafcff;">
        <span style="font-size:11px;color:#5a7a9a;">%roll）</span>
      </div>
      <div class="dev-row">
        <span class="dev-label">假放弃概率</span>
        <input type="number" id="devFakeGiveupProb" value="33" min="0" max="100">

    <div class="dev-group">
      <div class="dev-group-title">

    <div class="dev-actions">

<div class="mini-editor-overlay hidden" id="miniEditorOverlay">
  <div class="mini-editor-panel">
    <div class="edit-nav">
      <div class="edit-nav-left">
        <button class="edit-nav-btn" id="miniEditBack">返回</button>
      </div>

<!-- 导入/导出 -->
<div class="modal-overlay hidden" id="importModal">

<input type="file" id="fileInput" class="file-input-hidden" accept=".json">

<script>
(function() {
  'use strict';

  // ---- 常量 ----
  const MAX_LEN = 999999;
  const RECYCLE_LIMIT = 20;

  // ---- 状态 ----
  let memos = [], currentTab = 'all', editingId = null, confirmCb = null, expandState = {}, curiousActive = false, searchQuery = '';
  let revealedMap = {};
  let recycleBin = [];
  let denseFriendId = null;
  let dev = { special: true, reply: true, curiousProb: 50, giveupProb: 30, forceMode: 'cond', forceProb: 100, friendReadLimit: false, forceRollProb: 10, curiousTarget: { encrypted: true, unencrypted: false }, fakeGiveupProb: 33, refuseGiveupProb: 70, specialChars: [], replyChars: [], customCss: '', careEnabled: true, curiousSendMsg: true, specialCount: 1, replyCount: 1 };
  let memoEditHistory = {};
  const MAX_HISTORY = 3;

  let curiousCtx = {

    isForce: false, memoContent: '', memoId: null,

    fakeGiveupUsed: false
  };

  let specialTriggerToday = 0;
  let replyTriggerToday = 0;
  let lastSpecialDate = '';
  let lastReplyDate = '';
  let giveupLock = false;

  // ---- 缩小版编辑器状态 ----
  let miniEditorState = {
    isOpen: false,
    memoId: null,
    isNew: false,
    title: ''
  };

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const memoList = $('memoList'), searchInput = $('searchInput'), gearBtn = $('gearBtn'), fabAdd = $('fabAdd');
  const headerRecycle = $('headerRecycle');
  const devOverlay = $('devOverlay'), devClose = $('devClose'), devConfirm = $('devConfirmClose');
  const importModal = $('importModal'), importClose = $('importClose'), getJsonFormatBtn = $('getJsonFormatBtn'), importFileBtn = $('importFileBtn');

  async function saveEditHistory() {
    try {
      const existing = await AiPhone.db.list('config', { limit: 30 });
      const item = existing.find(c => c.id === 'memoEditHistory');
      const data = { id: 'memoEditHistory', data: memoEditHistory };

  async function pushEditHistory(memoId, title, content, blocks) {
    if (!memoEditHistory[memoId]) {
      memoEditHistory[memoId] = { history: [], index: -1 };
    }
    const entry = memoEditHistory[memoId];
    if (entry.index < entry.history.length - 1) {
      entry.history = entry.history.slice(0, entry.index + 1);
    }
    // 记录 blocks（含 author 标记），撤销/重做时能恢复"来自xx"样式
    entry.history.push({ title: title || '', content: content || '', blocks: blocks && Array.isArray(blocks) ? JSON.parse(JSON.stringify(blocks)) : null });
    if (entry.history.length > MAX_HISTORY) {
      entry.history.shift();
    }
    entry.index = entry.history.length - 1;
    await saveEditHistory();
  }

  function undoEditHistory(memoId) {
    const entry = memoEditHistory[memoId];
    if (!entry || entry.index <= 0) return null;
    entry.index--;
    return entry.history[entry.index];
  }

  function redoEditHistory(memoId) {
    const entry = memoEditHistory[memoId];
    if (!entry || entry.index >= entry.history.length - 1) return null;
    entry.index++;
    return entry.history[entry.index];
  }

  // ---- 数据 ----
  // 隐藏运行环境下工具 handler 可能在 loadMemos() 完成前就被宿主调用，
  // 此时内存 memos 还是空数组，导致"目标备忘录不存在/无记录"等假性失败，
  // 且 handler 内 saveMemos() 会按空数组比对删除数据库记录（数据丢失风险）。
  // 此函数供工具/事件 handler 在依赖 memos 前调用，确保数据已就绪。
  async function ensureMemosLoaded() {
    if (memosLoaded) return;
    try {
      const r = await AiPhone.db.list('memos', { limit: 500 });
      memos = r || [];
      memos.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      const cfg = await AiPhone.db.list('config', { limit: 30 });
      const rv = cfg.find(c => c.id === 'revealedMap');
      if (rv) revealedMap = rv.data || {};
      const recycle = cfg.find(c => c.id === 'recycleBin');
      if (recycle) recycleBin = recycle.data || [];
      const friend = cfg.find(c => c.id === 'denseFriend');
      if (friend) denseFriendId = friend.data || null;
      const devItem = cfg.find(c => c.id === 'devSettings');
      if (devItem && devItem.data) dev = { ...dev, ...devItem.data };
      memosLoaded = true;
    } catch(e) { logWarn('TOOL_LOAD', e.message); }
  }

  async function loadMemos() {
    try {
      const r = await AiPhone.db.list('memos', { limit: 500 });
      memos = r || [];
      memos.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      memosLoaded = true;
      const cfg = await AiPhone.db.list('config', { limit: 30 });
      const rv = cfg.find(c => c.id === 'revealedMap');
      if (rv) revealedMap = rv.data || {};
      const recycle = cfg.find(c => c.id === 'recycleBin');
      if (recycle) recycleBin = recycle.data || [];
      const friend = cfg.find(c => c.id === 'denseFriend');
      if (friend) {
        denseFriendId = friend.data || null;
      } else {
        denseFriendId = null;
      }
      if (denseFriendId) {
        try {
          const ch = await AiPhone.characters.get(denseFriendId);
          if (ch) friendBadge.textContent = '密友：' + (ch.name || '未知');
        } catch(e) {
          friendBadge.textContent = '密友：' + (denseFriendId || '未知');
        }
      } else {
        friendBadge.textContent = '未绑定密友';
      }
      const sc = cfg.find(c => c.id === 'specialCounter');
      if (sc) { specialTriggerToday = sc.count || 0; lastSpecialDate = sc.date || ''; }
      const rc = cfg.find(c => c.id === 'replyCounter');
      if (rc) { replyTriggerToday = rc.count || 0; lastReplyDate = rc.date || ''; }
      const today = todayStr();
      if (today !== lastSpecialDate) { specialTriggerToday = 0; lastSpecialDate = today; await saveSpecialCounter(); }
      if (today !== lastReplyDate) { replyTriggerToday = 0; lastReplyDate = today; await saveReplyCounter(); }
      const devItem = cfg.find(c => c.id === 'devSettings');
      if (devItem && devItem.data) {
        dev = { ...dev, ...devItem.data };
        applyDevUI();
      }
      // 一次性迁移：旧版本曾把「密友读取限制」默认保存为开启，导致密友仍受限。
      // 迁移后按新默认（密友开放全部）执行一次，此后用户手动开关不再被覆盖。
      const limitMig = cfg.find(c => c.id === 'friendReadLimitMigrated');
      if (!limitMig && dev.friendReadLimit === true) {
        dev.friendReadLimit = false;
        await saveDevToDB();
        try { await AiPhone.db.create('config', { id: 'friendReadLimitMigrated', data: true }); } catch(e) {}
        applyDevUI();
      }
      await loadEditHistory();
      render();
      tryTriggerDailySpecial();
    } catch(e) { logWarn('LOAD', e.message); memos = []; memosLoaded = false; render(); }
  }

  async function saveMemos() {
    try {
      const existing = await AiPhone.db.list('memos', { limit: 500 });
      const eIds = new Set(existing.map(m => m.id));
      const cIds = new Set(memos.map(m => m.id));
      for (const o of existing) { if (!cIds.has(o.id)) await AiPhone.db.delete('memos', o.id); }
      for (const m of memos) {
        if (eIds.has(m.id)) await AiPhone.db.update('memos', m.id, m);
        else await AiPhone.db.create('memos', m);
      }
      const cfg = await AiPhone.db.list('config', { limit: 30 });
      const rv = cfg.find(c => c.id === 'revealedMap');
      if (rv) await AiPhone.db.update('config', 'revealedMap', { id: 'revealedMap', data: revealedMap });
      else await AiPhone.db.create('config', { id: 'revealedMap', data: revealedMap });
      const recycle = cfg.find(c => c.id === 'recycleBin');
      if (recycle) await AiPhone.db.update('config', 'recycleBin', { id: 'recycleBin', data: recycleBin });
      else await AiPhone.db.create('config', { id: 'recycleBin', data: recycleBin });
      const friend = cfg.find(c => c.id === 'denseFriend');
      if (friend) await AiPhone.db.update('config', 'denseFriend', { id: 'denseFriend', data: denseFriendId });
      else await AiPhone.db.create('config', { id: 'denseFriend', data: denseFriendId });
      const devItem = cfg.find(c => c.id === 'devSettings');
      if (devItem) await AiPhone.db.update('config', 'devSettings', { id: 'devSettings', data: dev });
      else await AiPhone.db.create('config', { id: 'devSettings', data: dev });
    } catch(e) { logWarn('SAVE', e.message); showToast('保存失败'); }
  }

  function blocksToContent(blocks) {
    if (!blocks || !blocks.length) return '';
    return blocks.map(b => {
      if (b.type === 'text') return (b.text || '');
      if (b.type === 'image') return '[图片]';
      return '';
    }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // ---- CRUD ----
  async function addMemo(content, encrypted = false, createdAt = null, type = 'user', extra = {}) {
    if (extra.blocks && Array.isArray(extra.blocks) && extra.blocks.length) {
      content = blocksToContent(extra.blocks);
    }
    if (!content || !content.trim()) { return null; }
    const now = new Date();
    const created = createdAt ? new Date(createdAt) : now;
    const iso = isNaN(created.getTime()) ? now.toISOString() : created.toISOString();
    const characterId = extra.characterId || null;

    let characterName = extra.characterName || null;
    if (type === 'user' && !extra._skipUserName) {
      try {
        const profile = await AiPhone.user.getProfile();
        characterName = profile?.name || '用户';
      } catch(e) { characterName = '用户'; }
    }

    const memo = {
      id: genId(),
      content: content.trim(),
      encrypted: !!encrypted,
      favorite: false,
      locked: false,
      createdAt: iso,
      type: type,
      ...extra,
      characterId: characterId,
      characterName: characterName,
      _hideCharacterName: type === 'user' ? true : false,
      encryptedOpenTo: []
    };
    if (extra._title) {
      memo._title = extra._title;
    }
    if (extra._memoryAppEventId) {
      memo._memoryAppEventId = extra._memoryAppEventId;
    }
    if (extra.encryptedOpenTo) {
      memo.encryptedOpenTo = extra.encryptedOpenTo;
    }
    memos.push(memo);
    memos.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    await saveMemos();
    render();
    return memo;
  }

  // ---- 加密开放范围设置（长按弹窗） ----
  async function openEncryptSettings(memoId) {
    const memo = memos.find(m => m.id === memoId);
    if (!memo) return;
    if (memo.locked) {
      showToast('该备忘录已锁定，无法修改加密设置');
      return;
    }
    const chars = await AiPhone.characters.list();
    if (!chars || !chars.length) {
      showToast('没有可用的角色');
      return;
    }
    const currentOpen = memo.encryptedOpenTo || [];

    const ov = document.createElement('div');
    ov.className = 'modal-overlay topmost';
    ov.innerHTML = `
      <div class="modal-box">
        <div style="font-size:13px;color:#5a7a9a;margin-bottom:6px;">谁可以看</div>
        <div class="friend-select-list" id="encryptOpenList">
          ${chars.map(c => `
            <button data-id="${c.id}" data-name="${escHtml(c.name || '未命名')}" style="${currentOpen.includes(c.id) ? 'background:#d0e5ff;' : ''}">
              ${escHtml(c.name || '未命名')} ${currentOpen.includes(c.id) ? '✓' : ''}
            </button>
          `).join('')}
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="encryptCancel">取消</button>
          <button class="btn btn-primary" id="encryptConfirm">确定</button>
        </div>
      </div>
    `;
    document.body.appendChild(ov);

    const list = ov.querySelector('#encryptOpenList');
    const selectedSet = new Set(currentOpen);

    list.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        if (selectedSet.has(id)) {
          selectedSet.delete(id);
          btn.style.background = '';
          btn.textContent = btn.textContent.replace(' ✓', '');
        } else {
          selectedSet.add(id);
          btn.style.background = '#d0e5ff';
          btn.textContent = btn.textContent + ' ✓';
        }
      });
    });

    ov.querySelector('#encryptCancel').addEventListener('click', () => ov.remove());
    ov.querySelector('#encryptConfirm').addEventListener('click', async () => {
      memo.encryptedOpenTo = Array.from(selectedSet);
      await saveMemos();
      ov.remove();
      showToast('加密开放范围已更新');
      render();
    });
  }

  // ---- 删除、恢复、更新等 ----
  async function deleteMemo(id, toRecycle = true) {
    const idx = memos.findIndex(m => m.id === id);
    if (idx === -1) return false;
    const memo = memos[idx];
    if (memo.locked) { showToast('该备忘录已锁定，无法删除'); return false; }
    if (toRecycle) {
      recycleBin.unshift({
        id: memo.id,
        data: JSON.parse(JSON.stringify(memo)),
        deletedAt: new Date().toISOString()
      });
      if (recycleBin.length > RECYCLE_LIMIT) {
        recycleBin = recycleBin.slice(0, RECYCLE_LIMIT);
      }
    }
    // 清理记忆（如有）
    if (memo._memoryAppEventId) {
      try { await AiPhone.memory.deleteTimeline({ appEventId: memo._memoryAppEventId }); } catch(e) {}
    }
    if (memo.replyData && memo.replyData.replies) {
      for (const r of memo.replyData.replies) {
        if (r.memoryAppEventId) {
          try { await AiPhone.memory.deleteTimeline({ appEventId: r.memoryAppEventId }); } catch(e) {}
        }
      }
    }
    memos.splice(idx, 1);
    await saveMemos();
    render();
    return true;
  }

  async function restoreMemo(recycleId) {
    const idx = recycleBin.findIndex(r => r.id === recycleId);
    if (idx === -1) return false;
    const item = recycleBin[idx];
    const memo = item.data;
    memo.id = genId();
    memos.push(memo);
    memos.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    recycleBin.splice(idx, 1);
    await saveMemos();
    render();
    return true;
  }

  async function toggleFav(id) { const m = memos.find(m => m.id === id); if (!m) return; m.favorite = !m.favorite; await saveMemos(); render(); }
  async function toggleLock(id) { const m = memos.find(m => m.id === id); if (!m) return; m.locked = !m.locked; await saveMemos(); render(); showToast(m.locked ? '已锁定' : '已解锁'); }
  async function toggleEncrypt(id) { 
    const m = memos.find(m => m.id === id); 
    if (!m) return; 
    m.encrypted = !m.encrypted; 
    // 如果关闭加密，清空开放列表
    if (!m.encrypted) {
      m.encryptedOpenTo = [];
    }
    await saveMemos(); 
    render(); 
    showToast(m.encrypted ? '已加密' : '已解密'); 
  }

  // ---- 识图辅助：取备忘录图片（最多4张，压缩到2MB内） ----
  async function getMemoImagesForAI(memo) {
    if (!memo || !memo.blocks || !memo.blocks.length) return [];
    const imgRefs = memo.blocks.filter(b => b.type === 'image' && b.ref).slice(0, 4);
    const out = [];
    for (const b of imgRefs) {
      try {
        const r = await AiPhone.media.get({ ref: b.ref });
        if (r && r.dataUrl) {
          const small = await compressImage(r.dataUrl, 2000 * 1024);
          out.push({ role: 'user', content: '（备忘录中的图片）', image: small });
        }
      } catch(e) {}
    }
    return out;
  }

  // ---- 记忆写入辅助函数 ----
  let cachedUserName = null;
  async function getUserDisplayName() {
    if (cachedUserName) return cachedUserName;
    try {
      const profile = await AiPhone.user.getProfile();
      if (profile?.name) { cachedUserName = profile.name; return profile.name; }
    } catch(e) {}
    return '用户';
  }

  async function writeCharacterMemory(characterId, title, content) {
    if (!characterId) return;
    try {
      await AiPhone.memory.addTimeline({
        characterId: characterId,
        appLabel: '备忘录',
        summary: title,
        detail: content || '',
        appEventId: 'memo_memory_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5)
      });
    } catch(e) {
      logWarn('MEM_WRITE', '记忆写入失败', e.message);
    }
  }

  // ============================================================
  // 第四版：render 函数（含加密标签单击/长按新交互）
  // ============================================================
  function render() {
    let filtered = currentTab === 'all' ? memos.slice() : memos.filter(m => m.favorite);

    try {
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        filtered = filtered.filter(m => {
          if (m.content.toLowerCase().includes(q)) return true;
          if (m.replyData && m.replyData.replies) {
            return m.replyData.replies.some(r => r.content.toLowerCase().includes(q));
          }
          return false;
        });
      }
    } catch(e) {
      showError('搜索异常', '搜索时发生错误：' + e.message);
      logWarn('SEARCH', e.message);
    }

    filtered.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

    if (!filtered.length) {
      memoList.innerHTML = `<div class="empty-state">${currentTab === 'all' ? '还没有备忘录，写一条吧' : '收藏列表为空'}</div>`;
      return;
    }

    let html = '';
    for (const memo of filtered) {
      const type = memo.type || 'user';
      const isSpecial = type === 'special', isReply = type === 'reply', isDaibi = type === 'daibi';
      const isEnc = memo.encrypted === true;
      const isFav = memo.favorite === true;
      const isLocked = memo.locked === true;
      const isUserMemo = type === 'user';

      let cls = 'memo-card';
      if (isSpecial || isReply) cls += ' special';
      if (isDaibi) cls += ' daibi';
      if (isLocked) cls += ' locked';

      let badges = '';
      if (isSpecial) badges += '<span class="badge badge-special">角色留言</span>';
      if (isReply) badges += '<span class="badge badge-reply">角色回复</span>';
      if (isDaibi) badges += '<span class="badge badge-daibi">角色代笔</span>';

      let showUnknown = false;
      if ((isSpecial || isReply) && memo.characterName && memo.source === 'random') {
        showUnknown = true;
        const key = memo.id + '_' + memo.characterName;
        const rev = revealedMap[key] === true;
        if (rev) {
          badges = '<span class="badge badge-unknown revealed" style="cursor:default;">' + escHtml(memo.characterName) + '</span>' + badges;
        } else {
          badges = '<span class="badge badge-unknown" data-id="' + memo.id + '" data-char="' + escHtml(memo.characterName) + '" data-action="guess">未知</span>' + badges;
        }
      }

      if (!showUnknown && (isSpecial || isDaibi) && memo.characterName && !memo._hideCharacterName && !isUserMemo) {
        badges = '<span class="badge badge-daibi-name">' + escHtml(memo.characterName) + '</span>' + badges;
      }

      // 加密标签（新交互：单击切换，长按1秒弹窗）
      const encClass = isEnc ? 'badge-encrypted' : 'badge-encrypted inactive';
      badges += '<span class="badge ' + encClass + ' encrypt-toggle" data-id="' + memo.id + '">加密</span>';

      const lockClass = isLocked ? 'badge-lock active' : 'badge-lock';
      badges += '<span class="badge ' + lockClass + '" data-id="' + memo.id + '" data-action="toggleLock">锁定</span>';

      let displayTitle = memo._title || '';
      if (!displayTitle) {
        const content = memo.content || '';
        if (content.length <= 12) {
          displayTitle = content;
        } else {
          const punctMatch = content.match(/^.{0,12}[。，、！？；：,;!?\n]/);
          if (punctMatch) {
            displayTitle = punctMatch[0].replace(/[。，、！？；：,;!?\n]$/, '');
          } else {
            displayTitle = content.slice(0, 12);
          }
        }
      }

      const fullContent = memo.content || '';
      const isExp = expandState[memo.id] || false;
      const isLong = fullContent.length > 20;
      let displayContent = fullContent;
      if (isLong && !isExp) {
        displayContent = fullContent.slice(0, 20) + '…';
      }
      const contentCls = 'memo-content' + (isExp ? ' expanded' : '');

      const hasReplies = memo.replyData && memo.replyData.replies && memo.replyData.replies.length > 0;

      const hasHistory = memoEditHistory[memo.id] && memoEditHistory[memo.id].history.length > 1;
      const histEntry = memoEditHistory[memo.id];
      const canUndo = histEntry && histEntry.index > 0;
      const canRedo = histEntry && histEntry.index < histEntry.history.length - 1;

      html += '<div class="' + cls + '" data-id="' + memo.id + '">';
      html += '  <div class="memo-header"><span class="memo-time">' + formatTime(memo.createdAt) + '</span><div class="memo-top-right">' + badges + '</div></div>';
      html += '  <div class="memo-title">' + escHtml(displayTitle || '(无标题)') + '</div>';
      let contentHtml = escHtml(fullContent);
      contentHtml = contentHtml.replace(/\n/g, '<br>');
      html += '  <div class="memo-content">' + contentHtml + '</div>';
      const memoBlocks = (memo.blocks && Array.isArray(memo.blocks)) ? memo.blocks : null;
      if (memoBlocks && memoBlocks.some(b => b.type === 'image')) {
        const imgs = memoBlocks.filter(b => b.type === 'image');
        html += '  <div class="memo-thumbs">';
        for (const b of imgs) {
          html += '    <div class="memo-thumb" data-ref="' + escHtml(b.ref || '') + '"><div class="thumb-placeholder">图片</div></div>';
        }
        html += '  </div>';
      }
      html += '  <div class="memo-bottom">';
      html += '    <div class="memo-actions">';
      html += '      <button class="btn btn-sm btn-danger delete-btn" data-id="' + memo.id + '">删除</button>';
      html += '      <button class="btn btn-sm btn-outline share-btn" data-id="' + memo.id + '">分享</button>';
      if (hasReplies) html += '      <button class="btn btn-sm btn-outline view-reply-btn active" data-id="' + memo.id + '">查看回复</button>';
      else html += '      <button class="btn btn-sm btn-outline view-reply-btn" data-id="' + memo.id + '" style="color:#8aaac8;">查看回复</button>';
      html += '    </div>';
      html += '    <div style="display:flex;align-items:center;gap:2px;">';
      html += '      <button class="edit-history-btn undo-btn" data-id="' + memo.id + '" style="font-size:14px;border:none;background:transparent;color:' + (canUndo ? '#2a4a6a' : '#b0c8e0') + ';cursor:' + (canUndo ? 'pointer' : 'default') + ';padding:0 2px;">◄</button>';
      html += '      <button class="edit-history-btn redo-btn" data-id="' + memo.id + '" style="font-size:14px;border:none;background:transparent;color:' + (canRedo ? '#2a4a6a' : '#b0c8e0') + ';cursor:' + (canRedo ? 'pointer' : 'default') + ';padding:0 2px;">►</button>';
      html += '      <button class="favorite-star ' + (isFav ? 'active' : '') + '" data-id="' + memo.id + '">' + (isFav ? '★' : '☆') + '</button>';
      html += '    </div>';
      html += '  </div>';

      if (hasReplies && expandState[memo.id + '_reply']) {
        html += '  <div class="reply-expand">';
        const replies = memo.replyData.replies;
        for (let i = 0; i < replies.length; i++) {
          const r = replies[i];
          const charName = r.characterName || memo.replyData.characterName || '未知';
          html += '    <div class="reply-item">';
          html += '      <div class="reply-body">';
          html += '        <div class="reply-name">' + escHtml(charName) + ' <span class="reply-time">' + formatTime(r.createdAt) + '</span></div>';
          html += '        <div class="reply-text">' + escHtml(r.content) + '</div>';
          html += '      </div>';
          html += '      <div class="reply-actions">';
          html += '        <button class="btn btn-sm btn-outline reply-detail-btn" data-memo="' + memo.id + '" data-index="' + i + '">···</button>';
          html += '      </div>';
          html += '    </div>';
        }
        html += '  </div>';
      }
      html += '</div>';
    }
    memoList.innerHTML = html;

    // ---- 事件绑定 ----
    document.querySelectorAll('.favorite-star').forEach(el => el.addEventListener('click', () => toggleFav(el.dataset.id)));
    document.querySelectorAll('[data-action="toggleLock"]').forEach(el => el.addEventListener('click', () => toggleLock(el.dataset.id)));

    // 点击卡片（标题/内容/非功能按钮区域）进入全屏编辑
    document.querySelectorAll('.memo-card').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('.badge') || e.target.closest('.favorite-star') || e.target.closest('.edit-history-btn')) return;
        const id = el.dataset.id;
        const memo = memos.find(m => m.id === id);
        if (memo && memo.locked) { showToast('该备忘录已锁定，无法编辑'); return; }
        openMiniEditor(id, false);
      });
    });

    document.querySelectorAll('.delete-btn').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.dataset.id;
        const memo = memos.find(m => m.id === id);
        if (memo && memo.locked) { showToast('该备忘录已锁定，无法删除'); return; }
        showConfirm('删除备忘录', '确定删除？将移入回收站', async (confirmed) => {
          if (confirmed) { await deleteMemo(id, true); closeConfirm(); }
          else closeConfirm();
        }, true);
      });
    });

    document.querySelectorAll('.share-btn').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openShareTarget(el.dataset.id);
      });
    });

    document.querySelectorAll('.view-reply-btn').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleReplyExpand(el.dataset.id);
      });
    });

    document.querySelectorAll('[data-action="toggleExpand"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.dataset.id;
        expandState[id] = !expandState[id];
        render();
      });
    });

    document.querySelectorAll('[data-action="guess"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openGuess(el.dataset.id, el.dataset.char);
      });
    });

    document.querySelectorAll('.reply-detail-btn').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openReplyDetail(el.dataset.memo, parseInt(el.dataset.index));
      });
    });

    document.querySelectorAll('.undo-btn').forEach(el => {
      el.addEventListener('click', async (e) => {
        if (el.disabled) return;
        e.stopPropagation();
        const id = el.dataset.id;
        const result = undoEditHistory(id);
        if (result) {
          const memo = memos.find(m => m.id === id);
          if (memo) {
            memo._title = result.title;
            memo.content = result.content;
            // 优先恢复完整 blocks（含 author 标记，保留"来自xx"样式）；否则重算并保留图片块
            if (result.blocks && Array.isArray(result.blocks)) {
              memo.blocks = JSON.parse(JSON.stringify(result.blocks));
            } else if (Array.isArray(memo.blocks) && memo.blocks.length) {
              const imgBlocks = memo.blocks.filter(b => b.type === 'image');
              memo.blocks = [...imgBlocks, ...roleTextToBlocks(result.content)];
            }
            await saveMemos();
            render();
            showToast('已回退');
          }
        }
      });
    });

    document.querySelectorAll('.redo-btn').forEach(el => {
      el.addEventListener('click', async (e) => {
        if (el.disabled) return;
        e.stopPropagation();
        const id = el.dataset.id;
        const result = redoEditHistory(id);
        if (result) {
          const memo = memos.find(m => m.id === id);
          if (memo) {
            memo._title = result.title;
            memo.content = result.content;
            // 优先恢复完整 blocks（含 author 标记，保留"来自xx"样式）；否则重算并保留图片块
            if (result.blocks && Array.isArray(result.blocks)) {
              memo.blocks = JSON.parse(JSON.stringify(result.blocks));
            } else if (Array.isArray(memo.blocks) && memo.blocks.length) {
              const imgBlocks = memo.blocks.filter(b => b.type === 'image');
              memo.blocks = [...imgBlocks, ...roleTextToBlocks(result.content)];
            }
            await saveMemos();
            render();
            showToast('已重做');
          }
        }
      });
    });

    // ---- 异步加载图片缩略图 ----
    document.querySelectorAll('.memo-thumb[data-ref]').forEach(el => {
      const ref = el.dataset.ref;
      if (!ref) return;
      AiPhone.media.get({ ref: ref }).then(img => {
        if (img && img.dataUrl && el.isConnected) el.innerHTML = '<img src="' + img.dataUrl + '" alt="">';
      }).catch(() => {});
    });

    // ---- 加密标签：单击切换加密，长按1秒打开开放范围设置 ----
    document.querySelectorAll('.encrypt-toggle').forEach(el => {
      const id = el.dataset.id;
      let longPressTimer = null;
      let isLongPress = false;

      const startLongPress = (e) => {
        isLongPress = false;
        longPressTimer = setTimeout(() => {
          isLongPress = true;
          const memo = memos.find(m => m.id === id);
          if (memo) {
            openEncryptSettings(id);
          }
          longPressTimer = null;
        }, 1000);
      };
      const endLongPress = () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };

      el.addEventListener('click', (e) => {
        if (isLongPress) {
          isLongPress = false;
          return;
        }
        toggleEncrypt(id);
      });

      el.addEventListener('mousedown', startLongPress);
      el.addEventListener('mouseup', endLongPress);
      el.addEventListener('mouseleave', endLongPress);
      el.addEventListener('touchstart', startLongPress, { passive: true });
      el.addEventListener('touchend', endLongPress, { passive: true });
      el.addEventListener('touchcancel', endLongPress, { passive: true });
    });
  }

  // ---- 其他功能函数 ----
  function toggleReplyExpand(memoId) {
    const memo = memos.find(m => m.id === memoId);
    if (!memo) return;
    if (!memo.replyData || !memo.replyData.replies || !memo.replyData.replies.length) {
      const ov = document.createElement('div');
      ov.className = 'modal-overlay topmost';
      ov.innerHTML = `<div class="modal-box" style="text-align:center;"><h3 style="color:#6a8aaa;">暂无回复</h3><p style="margin:8px 0;font-size:14px;">您可以分享给角色生成回复</p><div class="modal-actions" style="justify-content:center;"><button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()">知道了</button></div></div>`;
      document.body.appendChild(ov);
      return;
    }
    const key = memoId + '_reply';
    expandState[key] = !expandState[key];
    render();
  }

  function openRecycleBin() {
    if (!recycleBin || !recycleBin.length) {
      showToast('回收站为空');
      return;
    }
    const ov = document.createElement('div');
    ov.className = 'modal-overlay topmost';
    ov.innerHTML = `
      <div class="modal-box">

  async function openGuess(memoId, charName) {

  // ---- 全屏编辑：blocks 结构 + 撤销/重做栈 ----
  let editBlocks = [];
  let editUndoStack = [];
  let editRedoStack = [];

  function blocksToEditContent(blocks) {
    if (!blocks || !blocks.length) return '';
    return blocks.map(b => b.type === 'text' ? (b.text || '') : '[图片]').join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function contentToBlocks(content) {
    if (!content || !content.trim()) return [];
    const lines = content.split('\n');
    const blocks = [];
    let buf = '';
    const flush = () => { if (buf !== '') { blocks.push({ type: 'text', text: buf }); } buf = ''; };
    for (const line of lines) {
      if (line.trim() === '[图片]') { flush(); blocks.push({ type: 'image', ref: '' }); }
      else buf = buf ? buf + '\n' + line : line;
    }
    flush();
    return blocks;
  }

  // 角色输出 → blocks：按 [新文本框] 分隔符拆成多个文本框（无分隔符=单个文本框）
  function roleTextToBlocks(text) {
    if (!text || !text.trim()) return [];
    const blocks = [];
    for (const part of String(text).split(/\[新文本框\]/)) {
      const t = (part || '').trim();
      if (t) blocks.push({ type: 'text', text: t });
    }
    return blocks;
  }

  // 用户话术 → blocks：把自然语言里的分隔指令（隔断/新建文本框/另起一段等）转成 [新文本框] 分隔符。
  // 「新文本框」与「新建文本框」等价，都表示同一个分隔符；同时兼容「新起一段/再开一段/重新建文本框」等变体。
  // 适用于"用户直接口述的内容"与"角色生成内容里携带的分隔意图"；角色工具输出请按 presets 提示直接写 [新文本框]。
  function naturalToBlocks(text) {
    if (!text) return '';
    let t = String(text);
    // 先保护已写好的 [新文本框] 完整标记：否则下方关键词替换会把标记里的「新文本框」再套一层括号，
    // 变成 [[新文本框]]，拆解后残留单个 [ ]（表现为 123[ 换行 ]456[ 这种坏块）
    t = t.replace(/\[\s*新文本框\s*\]\s*[:：]?\s*/g, '\u0001');
    t = t.replace(/(新起(?:一段)?|再开(?:一段)?|另起(?:一段)?|新建(?:一个)?文本框|重新建(?:一个)?文本框|新开(?:一个)?文本框|另开(?:一个)?文本框|新文本框|新建文本框|隔断|隔开|分隔|分块|分框|分一下|再写一段|再记一段|换一段|换一块|另换一块)(?:一下|一截|开来|一些)?/g, '\u0001');
    t = t.replace(/\u0001+/g, '\u0001');
    t = t.replace(/\u0001/g, '[新文本框]');
    return t;
  }

  // 把 memo 的 blocks 转成带结构标记的文本（供 AI 阅读/编辑），
  // 文本框之间用 [新文本框] 分隔、图片用 [图片] 占位，角色据此知道结构、编辑时不丢框。
  function blocksToStructuredText(blocks) {
    if (!blocks || !Array.isArray(blocks) || !blocks.length) return '';
    return blocks.map(b => {
      if (b.type === 'text') return (b.text || '');
      if (b.type === 'image') return '[图片]';
      return '';
    }).join('[新文本框]').replace(/(\[新文本框\]){2,}/g, '[新文本框]').trim();
  }

  // 取一条备忘录给 AI 看的内容：有 blocks 用结构化文本，否则用 content
  function getMemoContentForAI(m) {
    if (m && m.blocks && Array.isArray(m.blocks) && m.blocks.length) {
      return blocksToStructuredText(m.blocks);
    }
    return (m && m.content) ? m.content : '';
  }

  // 解析序数词：「第二个」→ 2、「第3个」→ 3；解析不了默认 1
  function parseOrd(s) {
    if (!s) return 1;
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    const map = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
    if (map[s] !== undefined) return map[s];
    if (s === '十' || s === '10') return 10;
    return 1;
  }

  // 把带结构标记的文本（[新文本框]/[图片]）解析回 blocks。
  // 图片 ref 从 oldBlocks 中按出现顺序恢复（角色保留标记则图片原样保留，删掉标记则删图）。
  // 文本块不继承 author（整段重写不带「来自xx」样式）。
  function structuredToBlocks(text, oldBlocks) {
    if (!text || !text.trim()) return [];
    const imgRefs = (oldBlocks || []).filter(b => b.type === 'image').map(b => b.ref);
    let imgIdx = 0;
    const parts = String(text).split(/\[新文本框\]/);
    const blocks = [];
    for (const raw of parts) {
      const part = (raw || '').trim();
      if (!part) continue;
      const segs = part.split(/\[图片\]/);
      for (let i = 0; i < segs.length; i++) {
        const s = (segs[i] || '').trim();
        if (s) blocks.push({ type: 'text', text: s });
        if (i < segs.length - 1) {
          blocks.push({ type: 'image', ref: imgRefs[imgIdx] || '' });
          imgIdx++;
        }
      }
    }
    return blocks;
  }

  function pushEditSnapshot() {
    pushEditSnapshotWithTitle(miniEditTitle.value);
  }

  function pushEditSnapshotWithTitle(title) {
    const snap = { title: title || '', blocks: JSON.parse(JSON.stringify(editBlocks)) };
    const last = editUndoStack[editUndoStack.length - 1];
    if (last && last.title === snap.title && JSON.stringify(last.blocks) === JSON.stringify(snap.blocks)) return;
    editUndoStack.push(snap);
    if (editUndoStack.length > 100) editUndoStack.shift();
    editRedoStack = [];
  }

  function editUndo() {
    if (!editUndoStack.length) return;
    const cur = { title: miniEditTitle.value, blocks: JSON.parse(JSON.stringify(editBlocks)) };
    const prev = editUndoStack.pop();
    editRedoStack.push(cur);
    miniEditTitle.value = prev.title;
    editBlocks = prev.blocks || [];
    renderBlocks(true);
  }

  function editRedo() {
    if (!editRedoStack.length) return;
    const cur = { title: miniEditTitle.value, blocks: JSON.parse(JSON.stringify(editBlocks)) };
    const next = editRedoStack.pop();
    editUndoStack.push(cur);
    miniEditTitle.value = next.title;
    editBlocks = next.blocks || [];
    renderBlocks(true);
  }

  // 渲染：重建全新节点 + 焦点/光标恢复。
  // iOS Safari 对"复用的 textarea 被程序化改 value / 容器被插入兄弟节点"会进入僵尸态
  // （无法聚焦、聚焦后无法改已有内容），所以每次结构变化都用全新节点重建，
  // 并在用户手势触发的渲染里恢复焦点与光标位置。
  function renderBlocks(restoreFocus) {
    // 记录当前焦点与光标
    const active = document.activeElement;
    let focusIdx = -1, selStart = -1, selEnd = -1;
    if (active && active.tagName === 'TEXTAREA' && miniEditBlocks.contains(active)) {
      focusIdx = parseInt(active.dataset.idx, 10);
      try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e) {}
    }

    miniEditBlocks.innerHTML = '';
    editBlocks.forEach((b, idx) => {
      if (b.type === 'text') {
        const ta = document.createElement('textarea');
        ta.className = 'edit-block-text';
        ta.placeholder = '写点什么...';
        ta.value = b.text || '';
        ta.dataset.idx = idx;
        if (b.author) {
          // 角色代写块：外层包一层特殊容器，顶部加"来自xx"小标签（不可编辑）
          const wrap = document.createElement('div');
          wrap.className = 'edit-block-text-wrap';
          wrap.dataset.idx = idx;
          const tag = document.createElement('div');
          tag.className = 'edit-block-author';
          tag.textContent = '来自 ' + (b.author || '角色');
          wrap.appendChild(tag);
          wrap.appendChild(ta);
          miniEditBlocks.appendChild(wrap);
        } else {
          miniEditBlocks.appendChild(ta);
        }
      } else {
        const wrap = document.createElement('div');
        wrap.className = 'edit-block-image';
        wrap.dataset.idx = idx;
        const img = document.createElement('img');
        img.alt = '';
        img.draggable = false;
        img.onload = () => { if (img.isConnected) img.parentElement.classList.add('loaded'); };
        if (b.ref) {
          const ref = b.ref;
          AiPhone.media.get({ ref: ref }).then(r => { if (r && r.dataUrl && img.isConnected) img.src = r.dataUrl; }).catch(() => {});
        }
        wrap.appendChild(img);
        miniEditBlocks.appendChild(wrap);
      }
    });

    // 布局就绪后再统一计算高度：刚插入 DOM 时 scrollHeight 尚未刷新，
    // 立即 autoGrow 会取到 0，导致长文本/图片显示成矮框
    requestAnimationFrame(() => {
      miniEditBlocks.querySelectorAll('textarea').forEach(ta => autoGrow(ta));
    });
    setTimeout(() => {
      miniEditBlocks.querySelectorAll('textarea').forEach(ta => autoGrow(ta));
    }, 60);

    if (!editBlocks.length) {
      const empty = document.createElement('div');
      empty.className = 'edit-blocks-empty';
      empty.textContent = '内容为空，点右下角 + 添加文本框或图片';
      // 点击由容器事件委托统一处理（避免与委托重复触发）
      miniEditBlocks.appendChild(empty);
    }
    updateEditCharCount();

    // 恢复焦点与光标（默认开启；异步触发的渲染如添加图片请传 false）
    if (restoreFocus !== false && focusIdx >= 0 && focusIdx < editBlocks.length && editBlocks[focusIdx].type === 'text') {
      const node = miniEditBlocks.children[focusIdx];
      const ta = node && node.tagName === 'TEXTAREA' ? node : (node ? node.querySelector('textarea') : null);
      if (ta) {
        ta.focus();
        if (selStart >= 0) {
          try { ta.setSelectionRange(selStart, selEnd >= 0 ? selEnd : selStart); } catch(e) {}
        }
      }
    }
  }

  function updateEditCharCount() {
    miniEditCharCount.textContent = blocksToEditContent(editBlocks).length;
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
  }

  // 长按 1 秒弹菜单（上移/下移/删除/查看详情）
  const longPressArmed = new Set();
  let blocksLongPressTimer = null;
  let blocksLongPressEl = null;

  // 事件委托到 blocks 容器：长按/点击/输入/右键统一处理。
  // 长按策略：文本框的 touchstart 绝不拦截（保证聚焦编辑正常），
  // 用「按住 ≥1 秒且未移动」判定长按；图片块才由 document 层拦截原生手势。
  function setupBlocksDelegate() {
    const container = miniEditBlocks;
    let lpStartX = 0, lpStartY = 0, lpTimer = null, lpIdx = -1;

    const cancelLp = () => { clearTimeout(lpTimer); lpTimer = null; lpIdx = -1; };

    container.addEventListener('touchstart', (e) => {
      const blockEl = e.target.closest('.edit-block-text, .edit-block-image, .edit-block-text-wrap');
      if (!blockEl) return;
      const t = e.touches[0];
      lpStartX = t.clientX; lpStartY = t.clientY;
      const idx = parseInt(blockEl.dataset.idx, 10);
      lpIdx = isNaN(idx) ? -1 : idx;
      clearTimeout(lpTimer);
      lpTimer = setTimeout(() => { lpTimer = null; if (lpIdx >= 0) showBlockMenu(lpIdx); }, 1000);
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      if (lpTimer) {
        const t = e.touches[0];
        if (Math.abs(t.clientX - lpStartX) > 10 || Math.abs(t.clientY - lpStartY) > 10) cancelLp();
      }
    }, { passive: true });

    container.addEventListener('touchend', cancelLp, { passive: true });
    container.addEventListener('touchcancel', cancelLp, { passive: true });

    // 鼠标长按（桌面调试用）
    container.addEventListener('mousedown', (e) => {
      const blockEl = e.target.closest('.edit-block-text, .edit-block-image, .edit-block-text-wrap');
      if (!blockEl) return;
      const idx = parseInt(blockEl.dataset.idx, 10);
      if (isNaN(idx)) return;
      clearTimeout(lpTimer);
      lpTimer = setTimeout(() => { lpTimer = null; showBlockMenu(idx); }, 1000);
    });
    container.addEventListener('mouseup', cancelLp);
    container.addEventListener('mouseleave', cancelLp);

    container.addEventListener('click', (e) => {
      const imgWrap = e.target.closest('.edit-block-image');
      if (imgWrap) {
        const idx = parseInt(imgWrap.dataset.idx, 10);
        const b = editBlocks[idx];
        if (b && b.type === 'image') openImageDetail(b.ref);
        return;
      }
      if (e.target.closest('.edit-blocks-empty')) addTextBlock();
    });

    container.addEventListener('input', (e) => {
      const ta = e.target.closest('textarea');
      if (!ta) return;
      const idx = parseInt(ta.dataset.idx, 10);
      if (editBlocks[idx] && editBlocks[idx].type === 'text') {
        pushEditSnapshot();               // 先记录操作前状态
        editBlocks[idx].text = ta.value;
        autoGrow(ta);
        updateEditCharCount();
      }
    });

    container.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA') e.stopPropagation();
    });

    container.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.edit-block-text, .edit-block-image')) e.preventDefault();
    });
  }

  function showBlockMenu(idx) {
    const old = document.querySelector('.block-menu');
    if (old) old.remove();
    const block = editBlocks[idx];
    if (!block) return;
    const menu = document.createElement('div');
    menu.className = 'block-menu';
    let html = '';
    if (idx > 0) html += '<button data-act="up">上移</button>';
    if (idx < editBlocks.length - 1) html += '<button data-act="down">下移</button>';
    if (block.type === 'image') html += '<button data-act="view">查看详情</button>';
    html += '<button data-act="del" style="color:#ff8a8a;">删除</button>';
    menu.innerHTML = html;
    document.body.appendChild(menu);
    menu.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.act;
        menu.remove();
        if (act === 'view') {
          openImageDetail(block.ref);
          return;
        }
        pushEditSnapshot();               // 先记录操作前状态
        if (act === 'up' && idx > 0) {
          const t = editBlocks[idx - 1]; editBlocks[idx - 1] = editBlocks[idx]; editBlocks[idx] = t;
        } else if (act === 'down' && idx < editBlocks.length - 1) {
          const t = editBlocks[idx + 1]; editBlocks[idx + 1] = editBlocks[idx]; editBlocks[idx] = t;
        } else if (act === 'del') {
          editBlocks.splice(idx, 1);
        }
        renderBlocks(false);
      });
    });
    // 点击菜单外部（或触摸外部）关闭；touchend+click 双保险。
    // 菜单弹出时手指可能还未离开屏幕，松手的 touchend 会在 350ms 保护期内被忽略，
    // 避免"长按松手菜单立刻消失、点不到内容"。
    const menuOpenedAt = Date.now();
    const closeMenu = (e) => {
      const t = e.target;
      if (t && menu.contains(t)) return;
      if (e.type === 'touchend' && Date.now() - menuOpenedAt < 500) return;
      menu.remove();
      document.removeEventListener('click', closeMenu);
      document.removeEventListener('touchend', closeMenu);
    };
    setTimeout(() => {
      document.addEventListener('click', closeMenu);
      document.addEventListener('touchend', closeMenu);
    }, 0);
  }

  // 图片详情：滚轮 + 双指缩放
  function openImageDetail(ref) {
    if (!ref) return;
    const old = document.querySelector('.image-detail-overlay');
    if (old) old.remove();
    const ov = document.createElement('div');
    ov.className = 'image-detail-overlay';
    ov.innerHTML = '<div class="image-detail-box"><button class="image-detail-close">✕</button><div class="image-detail-stage"><img alt=""></div></div>';
    document.body.appendChild(ov);
    const img = ov.querySelector('img');
    AiPhone.media.get({ ref: ref }).then(r => { if (r && r.dataUrl) img.src = r.dataUrl; }).catch(() => {});
    ov.querySelector('.image-detail-close').addEventListener('click', () => ov.remove());
    let scale = 1;
    const stage = ov.querySelector('.image-detail-stage');
    const apply = () => { img.style.transform = 'scale(' + scale + ')'; };
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale = Math.min(5, Math.max(0.2, scale + (e.deltaY < 0 ? 0.15 : -0.15)));
      apply();
    }, { passive: false });
    let pinchDist = 0;
    stage.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }, { passive: true });
    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        if (pinchDist > 0) { scale = Math.min(5, Math.max(0.2, scale * (d / pinchDist))); pinchDist = d; apply(); }
      }
    }, { passive: true });
    stage.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinchDist = 0; }, { passive: true });
  }

  // 添加文本框 / 图片
  function addTextBlock() {
    pushEditSnapshot();                   // 先记录操作前状态
    editBlocks.push({ type: 'text', text: '' });
    renderBlocks(false);
    const areas = miniEditBlocks.querySelectorAll('textarea');
    const last = areas[areas.length - 1];
    if (last) last.focus();
  }

  // 添加图片：用隐藏 file input 选图（不依赖 media.pick 权限）
  function addImageBlock() {
    try { imageFileInput.click(); }
    catch(e) { logWarn('ADD_IMG', e.message); showToast('添加图片失败'); }
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error('读取失败'));
      reader.readAsDataURL(file);
    });
  }

  async function handleImageFile(e) {

      const small = await compressImage(dataUrl, 2000 * 1024);

      editBlocks.push({ type: 'image', ref: stored.ref });

  function compressImage(dataUrl, maxBytes) {
    return new Promise((resolve) => {
      try {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const maxSide = 1600;
            if (w > maxSide || h > maxSide) {
              if (w >= h) { h = Math.round(h * maxSide / w); w = maxSide; }
              else { w = Math.round(w * maxSide / h); h = maxSide; }
            }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            let q = 0.85;
            let out = canvas.toDataURL('image/jpeg', q);
            while (out.length > maxBytes && q > 0.3) { q -= 0.15; out = canvas.toDataURL('image/jpeg', q); }
            resolve(out);
          } catch(e) { resolve(dataUrl); }
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      } catch(e) { resolve(dataUrl); }
    });
  }

  async function saveMiniEditor() {
    const title = miniEditTitle.value.trim();
    const hasText = editBlocks.some(b => b.type === 'text' && (b.text || '').trim());
    const hasImage = editBlocks.some(b => b.type === 'image');
    const content = blocksToEditContent(editBlocks);
    const blocks = JSON.parse(JSON.stringify(editBlocks));

    if (!title && !hasText && !hasImage) {
      // 空内容：新建不创建；已有则直接删除（不进回收站）
      if (miniEditorState.isNew) {
        closeMiniEditor();
        return;
      }
      const memo = memos.find(m => m.id === miniEditorState.memoId);
      if (memo) {
        if (memo.locked) { showToast('该备忘录已锁定，无法编辑'); return; }

        closeMiniEditor();
        render();
        showToast('内容为空，已删除该备忘录');
      } else {
        closeMiniEditor();
      }
      return;
    }

    if (miniEditorState.isNew) {
      const memo = await addMemo(content, false, null, 'user', { _title: title, blocks: blocks });
      if (memo) {
        closeMiniEditor();
        render();
        if (!memo.encrypted) {
          await triggerCurious(getMemoContentForAI(memo), memo.id, 'curious');
        }
      }
    } else if (miniEditorState.memoId) {
      const memo = memos.find(m => m.id === miniEditorState.memoId);
      if (memo) {
        if (memo.locked) { showToast('该备忘录已锁定，无法编辑'); return; }
        memo.content = content;
        memo._title = title;
        memo.blocks = blocks;
        await saveMemos();
        closeMiniEditor();
        render();
      }
    }
  }

  function fallbackCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e) { return false; }
  }
  function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }

  async function handleFile(e) {
    const f = e.target.files[0]; if (!f) return;
    try {
      const txt = await f.text();
      const data = JSON.parse(txt);
      let arr = Array.isArray(data) ? data : (Array.isArray(data.memos) ? data.memos : null);
      if (!arr) { showToast('格式错误：应为备忘录 JSON 数组或导出文件'); return; }
      let ok = 0, skip = 0;
      for (const item of arr) {
        const c = item.content || '';
        if (!c.trim()) { skip++; continue; }
        let ct = item.createdAt || null;
        if (ct) { const d = new Date(ct); if (isNaN(d.getTime())) ct = null; }
        const extra = {};
        if (item._title) extra._title = item._title;
        if (item.blocks) {
          // 图片块：优先用 dataUrl（base64，跨设备导入）转存进媒体库；
          // 只有 ref（本机/同库）则保留原引用；两者都没有则转成文字占位
          extra.blocks = await Promise.all((item.blocks || []).map(async (b) => {
            if (b && b.type === 'image') {
              if (b.dataUrl) {
                try {
                  const stored = await AiPhone.media.put({ dataUrl: b.dataUrl });
                  return { type: 'image', ref: stored.ref };
                } catch(e) { return { type: 'text', text: '[图片]' }; }
              } else if (b.ref) {
                return { type: 'image', ref: b.ref };
              }
              return { type: 'text', text: '[图片]' };
            }
            return { ...(b || {}) };
          }));
        }
        if (item.characterId) extra.characterId = item.characterId;
        if (item.characterName) extra.characterName = item.characterName;
        if (item.encryptedOpenTo) extra.encryptedOpenTo = item.encryptedOpenTo;
        if (item.replyData) extra.replyData = item.replyData;
        const memo = await addMemo(c, item.encrypted === true, ct, item.type || 'user', extra);
        if (memo) {
          memo.favorite = item.favorite === true;
          memo.locked = item.locked === true;
          await saveMemos();
          ok++;
        }
      }
      render();
      showToast('导入完成：' + ok + ' 条' + (skip ? '，' + skip + ' 条跳过' : ''), true);
    } catch(e) { showError('批量导入失败', e.message); }
    fileInput.value = '';
  }

  // ---- 导出：直接下载 JSON（可选内嵌图片 base64，跨设备/跨实例可用；失败时兜底展示文本） ----
  async function buildExportText(includeImages) {
    const clone = JSON.parse(JSON.stringify(memos));
    for (const m of clone) {
      if (m.blocks && Array.isArray(m.blocks)) {
        const newBlocks = [];
        for (const b of m.blocks) {
          if (b.type === 'image') {
            if (includeImages && b.ref) {
              let dataUrl = null;
              try {
                const r = await AiPhone.media.get({ ref: b.ref });
                if (r && r.dataUrl) dataUrl = r.dataUrl;
              } catch(e) {}
              newBlocks.push({ type: 'image', ref: b.ref, dataUrl: dataUrl });
            } else {
              // 不导出图片时转为文字占位，避免导入端出现失效引用
              newBlocks.push({ type: 'text', text: '[图片]' });
            }
          } else {
            newBlocks.push(JSON.parse(JSON.stringify(b)));
          }
        }
        m.blocks = newBlocks;
      }
    }
    return JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), memos: clone }, null, 2);
  }

      shareText += `类型：${typeLabel}\n`;

  // ---- 每日首次打开生成（含记忆写入） ----
  async function tryTriggerDailySpecial() {
    const today = todayStr();
    if (today !== lastSpecialDate) {
      specialTriggerToday = 0;
      lastSpecialDate = today;
      await saveSpecialCounter();
    }
    if (today !== lastReplyDate) {
      replyTriggerToday = 0;
      lastReplyDate = today;
      await saveReplyCounter();
    }
    let generated = 0;
    // 角色留言：仅在启用开关打开且今日未生成满条数时执行
    if (dev.special && dev.specialCount > 0 && specialTriggerToday < dev.specialCount) {
      for (let i = specialTriggerToday; i < dev.specialCount; i++) {
      const ch = await pickRandomChar(dev.specialChars);
      if (!ch) break;
      {

        });
        let content = result.text || (h >= 22 || h < 5 ? '这么晚了，还没睡吗？' : (h >= 5 && h < 12 ? '早上好呀' : (h >= 12 && h < 18 ? '下午好' : '晚上好')));

        }

      }
      }

    }

    // 角色回复：仅在启用开关打开且今日未生成满条数时执行
    if (dev.reply && dev.replyCount > 0 && replyTriggerToday < dev.replyCount) {
      const candidates = memos.filter(m => m.type === 'user' && !m.encrypted);
      if (candidates.length) {
      for (let i = replyTriggerToday; i < dev.replyCount; i++) {
      const ch = await pickRandomChar(dev.replyChars);

        if (!target.replyData) target.replyData = { characterId: ch.id, characterName: ch.name || '角色', replies: [] };
        const entry = {
          content: content,
          createdAt: new Date().toISOString(),

          source: 'random',
          memoryAppEventId: null,

        };

        generated++;
        }
      }
      await saveReplyCounter();
      }
    }

    if (generated > 0) {
      showToast('📬 你收到了新的消息');
      render();
    }
  }
