  // ---- 好奇机制 ----
  function showCuriousPanel(text, phase) {
    const old = document.querySelector('.curious-overlay');
    if (old) old.remove();
    const ov = document.createElement('div');
    ov.className = 'curious-overlay';

    const isGiveup = phase === 'giveup';
    const isForceAgree = phase === 'force_agree';
    const isFakeGiveup = phase === 'fake_giveup';
    const isStillWant = phase === 'still_want';

    let actions = '';
    if (isGiveup || isFakeGiveup) {
      actions = `<div class="curious-actions"><button class="btn btn-primary" id="curiousConfirm">确认</button></div>`;
    } else if (isForceAgree) {
      actions = `<div class="curious-actions"><button class="btn btn-outline" id="curiousRefuse" disabled>拒绝</button><button class="btn btn-primary" id="curiousAgree">同意</button></div>`;
    } else {
      actions = `<div class="curious-actions"><button class="btn btn-outline" id="curiousRefuse">拒绝</button><button class="btn btn-primary" id="curiousAgree">同意</button></div>`;
    }

    let textDisplay = text;
    if (isGiveup || isFakeGiveup) {
      textDisplay = `${curiousCtx.characterName}给你发送了一条新消息，要去看看吗？`;
    }
    ov.innerHTML = `<div class="curious-panel"><div class="curious-body"><div class="curious-name-box"><div class="name">${escHtml(curiousCtx.characterName)}</div></div><div class="curious-text">${escHtml(textDisplay)}</div></div>${actions}</div>`;
    document.body.appendChild(ov);

    if (isGiveup || isFakeGiveup) {
      const cfm = document.getElementById('curiousConfirm');
      if (cfm) {
        cfm.addEventListener('click', () => {
          ov.remove();
          if (isFakeGiveup) {
            triggerStillWant();
          } else {
            curiousActive = false;
            const settings = getSettings();
            if (Math.random() < settings.giveup.prob / 100 && !giveupMessageSent && !giveupLock) {
              giveupLock = true;
              sendGiveupMessage();
            }
            curiousCtx.attempt = 0;
            showToast(curiousCtx.characterName + ' 放弃了查看');
          }
        });
      }
      return;
    }

    if (isStillWant) {
      const agree = document.getElementById('curiousAgree');
      if (agree) {
        agree.addEventListener('click', () => {
          ov.remove();
          curiousActive = false;
          handleCuriousAgree();
        });
      }
      const refuse = document.getElementById('curiousRefuse');
      if (refuse) {
        refuse.addEventListener('click', () => {
          ov.remove();
          curiousCtx.attempt++;
          handleCuriousRefuse();
        });
      }
      return;
    }

    const agree = document.getElementById('curiousAgree');
    if (agree) {
      agree.addEventListener('click', () => {
        ov.remove();
        curiousActive = false;
        handleCuriousAgree();
      });
    }
    const refuse = document.getElementById('curiousRefuse');
    if (refuse) {
      refuse.addEventListener('click', () => {
        ov.remove();
        curiousCtx.attempt++;
        handleCuriousRefuse();
      });
    }
  }

  function showProgress(cb) {
    const old = document.querySelector('.reading-progress');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'reading-progress';
    el.innerHTML = `<div class="progress-text">正在阅读备忘录...</div><div class="progress-bar"><div class="fill" id="progressFill"></div></div>`;
    document.body.appendChild(el);

    const timer = setInterval(() => {

      if (p >= 100) { p = 100; clearInterval(timer); el.remove(); cb(); }
      fill.style.width = p + '%';
    }, step);
  }

  // ---- triggerCurious ----
  async function triggerCurious(memoContent, memoId, source) {
    if (curiousActive) return;
    const targetMemo = memos.find(m => m.id === memoId);
    if (!targetMemo) return;
    const isEncrypted = targetMemo.encrypted === true;

    const settings = getSettings();
    const target = dev.curiousTarget || { encrypted: true, unencrypted: false };
    let allowed = false;
    if (isEncrypted && target.encrypted) allowed = true;
    if (!isEncrypted && target.unencrypted) allowed = true;
    if (!allowed) return;

    let should = memoContent.length > 200 ? true : Math.random() < settings.curious.prob / 100;
    if (!should) return;

    curiousActive = true;
    giveupMessageSent = false;
    giveupLock = false;

    try {
      const chars = await AiPhone.characters.list();
      if (!chars || !chars.length) { curiousActive = false; return; }
      const ch = chars[Math.floor(Math.random() * chars.length)];

      let force = false;
      if (settings.force.mode === 'prob') {
        if (Math.random() < settings.force.prob / 100) force = true;
      } else {
        try {
          const char = await AiPhone.characters.get(ch.id);
          const rel = await AiPhone.characters.readRelations({ characterId: ch.id });
          const paranoid = char?.personality?.includes('偏执') || false;
          const intimacy = rel?.intimacy || 0;
          const count = (paranoid ? 1 : 0) + (intimacy >= 85 ? 1 : 0);
          const rollProb = (settings.forceRollProb ?? 10) / 100;
          if (count >= 2 && Math.random() < rollProb) force = true;
        } catch(e) {}
      }

      curiousCtx = {
        characterId: ch.id,
        characterName: ch.name || '好友',
        attempt: 0,
        maxAttempts: 5,
        isForce: force,
        memoContent: memoContent,
        memoId: memoId,
        forceMaxAttempts: 4,
        fakeGiveupUsed: false
      };

      showCuriousPanel('「' + curiousCtx.characterName + '」想看看你写的备忘录，可以吗？', 'request');
    } catch(e) { logWarn('CURIOUS', e.message); curiousActive = false; }
  }

  // ---- handleCuriousAgree（含关怀功能） ----
  async function handleCuriousAgree() {
    showProgress(async () => {
      const target = memos.find(m => m.id === curiousCtx.memoId);
      const imgMsgs = target ? await getMemoImagesForAI(target) : [];
      const result = await AiPhone.ai.generate({
        characterId: curiousCtx.characterId,
        appTags: ['memo', 'special'],
        messages: imgMsgs,
        instruction: '用户备忘录内容: ' + curiousCtx.memoContent + (imgMsgs.length ? '\n备忘录中还包含' + imgMsgs.length + '张图片，请结合图片内容一起理解。' : '') + '\n请生成一句角色回复，要求与备忘录内容相关。尽量简短（50字以内），只输出一句回复。'
      });
      let content = result.text || '好的，我看看。';
      content = cleanAI(content);
      if (!content) content = '好的，我看看。';

      if (target) {
        if (!target.replyData) target.replyData = { characterId: curiousCtx.characterId, characterName: curiousCtx.characterName, replies: [] };
        const entry = {
          content: content,
          createdAt: new Date().toISOString(),
          isConfirmed: false,
          source: 'curious',
          memoryAppEventId: null,
          characterName: curiousCtx.characterName,
          characterId: curiousCtx.characterId
        };
        target.replyData.replies.push(entry);
        await saveMemos();
        render();

        // ---- 写入记忆 ----
        const isForce = curiousCtx.isForce;
        const isFinalAgree = curiousCtx.attempt >= (isForce ? curiousCtx.forceMaxAttempts : curiousCtx.maxAttempts);
        const uName = await getUserDisplayName();
        const cName = curiousCtx.characterName || '角色';
        let memoryTitle = '';
        let memoryContent = '';

        if (isForce) {
          if (isFinalAgree && curiousCtx.attempt >= curiousCtx.forceMaxAttempts - 1) {
            memoryTitle = '曾对' + uName + '的备忘录[' + curiousCtx.memoId + ']产生了强烈的好奇，即使用户拒绝，依旧坚持查看，最后强制' + uName + '同意查看。';
            memoryContent = '加密备忘录内容是：' + curiousCtx.memoContent + '，' + cName + '生成的回复是：' + content;
          } else {
            memoryTitle = '曾对' + uName + '的备忘录产生了强烈的好奇，' + uName + '同意查看。';
            memoryContent = '加密备忘录内容是：' + curiousCtx.memoContent + '，' + cName + '生成的回复是：' + content;
          }
        } else {
          memoryTitle = '曾对' + uName + '的备忘录[' + curiousCtx.memoId + ']产生了好奇，' + uName + '同意查看。';
          memoryContent = '备忘录内容是：' + curiousCtx.memoContent + '，' + cName + '生成的回复是：' + content;
        }
        await writeCharacterMemory(curiousCtx.characterId, memoryTitle, memoryContent);

        // ---- 发消息策略：关怀优先（负面情绪且关怀开启），否则按「好奇同意后主动发消息」开关 ----
        const contentLower = target.content.toLowerCase();
        const negativeKeywords = ['难过', '伤心', '崩溃', '绝望', '痛苦', '抑郁', '焦虑', '愤怒', '生气', '恨', '受不了', '想死', '活不下去', '痛哭', '大哭', '绝望了', '心碎', '无助', '孤独', 'emo', '玉玉', '抑郁了', '气炸', '暴怒', '恼火', '焦躁', '不安', '心慌', '害怕', '恐慌', '紧张', '窒息', '忧愁', '忧伤', '哀愁', '苦闷', '郁闷', '烦死', '发愁', '难受', '煎熬', '折磨', '撑不住', '扛不住'];
        let needsCare = false;
        for (const kw of negativeKeywords) {
          if (contentLower.includes(kw)) {
            needsCare = true;
            break;
          }
        }
        if (dev.careEnabled && needsCare && target.type === 'user') {
          try {
            const careResult = await AiPhone.ai.generate({
              characterId: curiousCtx.characterId,
              appTags: ['memo', 'care'],
              messages: imgMsgs,
              instruction: `你看到用户写下了一条备忘录，内容包含负面情绪${imgMsgs.length ? '，并附有' + imgMsgs.length + '张图片（请结合图片一起理解）' : ''}。请用你的角色身份生成一条安慰回复，字数不超过300字，根据内容严重程度酌情决定篇幅；宁可简短真诚，不要空洞套话。\n（前缀可选：我看到了你写的备忘录）\n（内容：表达你的担心和询问，语气温和，表示愿意倾听，示例：我很担心你，你还好吗）\n（后缀可选：我们聊聊，好吗）\n\n备忘录内容：${getMemoContentForAI(target)}`
            });
            let careReply = careResult.text || '我看到了你写的备忘录，我很担心你，你还好吗？我们聊聊，好吗？';
            careReply = cleanAI(careReply);
            if (careReply) {
              await AiPhone.chat.writeHistory({
                characterId: curiousCtx.characterId,
                role: 'assistant',
                content: careReply
              });
              await AiPhone.chat.requestReply({ characterId: curiousCtx.characterId });
              showMessageNotification(curiousCtx.characterName, curiousCtx.characterId);
            }
          } catch(e) {
            logWarn('CARE', e.message);
          }
        } else if (dev.curiousSendMsg) {
          // 非关怀场景：重新生成一条"主动消息"（可选前缀+简短表达），再发送，不复用回复文本
          try {
            let sendText = content;
            try {
              const sendRes = await AiPhone.ai.generate({
                characterId: curiousCtx.characterId,
                appTags: ['memo', 'special'],
                instruction: '你刚刚看了用户的备忘录，内容：' + curiousCtx.memoContent + '\n现在给用户主动发一条消息。可以以"我看到你的备忘录了/我写好了"等类似话语开头（可选），然后简短地说说你想说的话。要求：自然简短，不要复述备忘录原文，50字以内。'
              });
              sendText = cleanAI(sendRes.text || content);
            } catch(e) {}
            if (!sendText) sendText = content;
            await AiPhone.chat.writeHistory({
              characterId: curiousCtx.characterId,
              role: 'assistant',
              content: sendText
            });
            await AiPhone.chat.requestReply({ characterId: curiousCtx.characterId });
            showMessageNotification(curiousCtx.characterName, curiousCtx.characterId);
          } catch(e) { logWarn('CURIOUS_SEND', e.message); }
        }

        const idx = target.replyData.replies.length - 1;
        openReplyDetail(curiousCtx.memoId, idx);
        showToast('已生成回复');
      }
      curiousCtx.attempt = 0;
    });
  }

  async function handleCuriousRefuse() {
    const isForce = curiousCtx.isForce;
    const maxAttempts = isForce ? curiousCtx.forceMaxAttempts : curiousCtx.maxAttempts;

    // 写入记忆：拒绝
    if (curiousCtx.attempt >= maxAttempts - 1 || !isForce) {
      const uName = await getUserDisplayName();
      await writeCharacterMemory(curiousCtx.characterId, '曾对' + uName + '的加密备忘录[' + curiousCtx.memoId + ']产生了好奇，但请求查看被' + uName + '拒绝。', '');
    }

    if (curiousCtx.attempt >= maxAttempts) {
      if (isForce) {
        const result = await AiPhone.ai.generate({
          characterId: curiousCtx.characterId,
          appTags: ['memo', 'curious', 'refuse'],
          instruction: '用户多次拒绝了你。你发自内心非常想看，请根据你的性格（可以是哭/怒/撒娇/坚持）生成一句"你必须同意"的话。只输出一句，不要提及次数。'
        });
        let reply = result.text || '你必须点同意。';
        reply = cleanAI(reply);
        showCuriousPanel(reply, 'force_agree');
      } else {
        const result = await AiPhone.ai.generate({
          characterId: curiousCtx.characterId,
          appTags: ['memo', 'curious', 'refuse'],
          instruction: '用户多次拒绝了你。请生成一句放弃的话。只输出一句，不要提及次数。'
        });
        let reply = result.text || '好吧，那我不打扰你了。';
        reply = cleanAI(reply);
        showCuriousPanel(reply, 'giveup');
      }
      return;
    }

    const settings = getSettings();
    if (isForce) {
      const canFakeGiveup = !curiousCtx.fakeGiveupUsed &&
                            curiousCtx.attempt >= 2 &&
                            curiousCtx.attempt <= 4;

      if (canFakeGiveup && Math.random() < settings.fakeGiveupProb / 100) {
        curiousCtx.fakeGiveupUsed = true;
        const result = await AiPhone.ai.generate({
          characterId: curiousCtx.characterId,
          appTags: ['memo', 'curious', 'refuse'],
          instruction: '用户拒绝了你。请生成一句放弃的话，但语气中透露一丝不甘心。只输出一句，不要提及次数。'
        });
        let reply = result.text || '好吧，那我不看了...';
        reply = cleanAI(reply);
        showCuriousPanel(reply, 'fake_giveup');
        return;
      }
    }

    if (!isForce && curiousCtx.attempt >= 1) {
      if (Math.random() < settings.refuseGiveupProb / 100) {
        const result = await AiPhone.ai.generate({
          characterId: curiousCtx.characterId,
          appTags: ['memo', 'curious', 'refuse'],
          instruction: '用户拒绝了你。请生成一句放弃的话。只输出一句，不要提及次数。'
        });
        let reply = result.text || '好吧，那我不打扰你了。';
        reply = cleanAI(reply);
        showCuriousPanel(reply, 'giveup');
        return;
      }
    }

    const result = await AiPhone.ai.generate({
      characterId: curiousCtx.characterId,
      appTags: ['memo', 'curious', 'refuse'],
      instruction: '用户拒绝了你。请根据你的角色性格生成一句坚持想看的话。只输出一句，不要提及次数。'
    });
    let reply = result.text || '就看一下嘛。';
    reply = cleanAI(reply);
    showCuriousPanel(reply, 'request');
  }

  // ---- 主动请求 ----
  function setupListener() {
    try {
      AiPhone.on('chat.message.created', async (payload) => {
        await ensureMemosLoaded();
        const text = payload.message?.content || '';
        const role = payload.message?.role || '';
        const charId = payload.characterId;
        const sessionId = payload.sessionId;
        if (role !== 'user') return;

        // 分享卡片等系统写入的 user 消息直接跳过（文本含"分享备忘录ID/挂载回复"等特征），
        // 否则会误触发"主动请求"流程并可能报错弹窗（分享本身已成功）。
        if (text.includes('分享备忘录ID') || text.includes('挂载回复') || /^\s*分享/.test(text)) return;

        const isDaibi = text.includes('帮我记') || text.includes('帮我写') || (text.includes('帮') && (text.includes('记') || text.includes('写')));
        const isReply = (text.includes('回复') || text.includes('看看')) && !isDaibi;
        const isMemo = text.includes('留言') && !isDaibi && !isReply;

        const hasAbility = text.includes('能') || text.includes('可以') || text.includes('能不能') || text.includes('给我') || text.includes('帮');
        if (!hasAbility) return;

        logInfo('LISTEN', '检测到请求: ' + text);

        try {
          const char = await AiPhone.characters.get(charId);
          if (!char) return;
          const charName = char.name || '角色';

          if (isDaibi) {
            let content = text.replace(/帮我记|帮我写|帮.*?记|帮.*?写/g, '').trim() || '（未指定内容）';
            // 用户话术里的「隔断/新建文本框」等指令词 → [新文本框] 分隔符，无需用户写符号
            content = naturalToBlocks(content);
            // 代笔：整条都是角色所写，首页有「角色代笔」徽章标识来源，编辑器内不逐块标注"来自xx"
            const memo = await addMemo(content, false, null, 'daibi', { characterName: charName, source: 'invite', blocks: roleTextToBlocks(content) });
            if (memo) {
              memo.characterName = charName;
              await saveMemos();
              render();
              await AiPhone.chat.writeHistory({ characterId: charId, role: 'assistant', content: '好呀，帮你记下来了。' });
              await AiPhone.chat.requestReply({ characterId: charId });
              logInfo('LISTEN', '已代笔写入');
            }
            return;
          }

          const history = await AiPhone.chat.readHistory({ sessionId: sessionId, limit: 10 });
          let shared = null;
          for (const msg of history) {
            if (msg.role === 'user' && msg.content && msg.content.includes('[分享')) {
              const m = msg.content.match(/\[分享[^\]]*\]\s*(.+)/);
              if (m) { shared = { content: m[1], full: msg.content }; break; }
            }
          }

          if (shared && isReply) {
            let targetId = null;
            const idMatch = shared.full.match(/ID:\s*([a-zA-Z0-9]+)/);
            if (idMatch) targetId = idMatch[1];

            const r = await AiPhone.ai.generate({
              characterId: charId,
              appTags: ['memo', 'invite'],
              instruction: '用户分享了一条备忘录并邀请你回复。用户消息：' + text + '\n备忘录内容：' + shared.content + '\n请根据角色性格决定是否同意。如果同意，输出「同意」；如果拒绝，输出一句拒绝语。只输出内容。'
            });
            let response = r.text || '同意';
            response = cleanAI(response);

            if (response.includes('同意') || response.includes('好') || response.includes('可以')) {
              if (targetId) {
                const target = memos.find(m => m.id === targetId);
                if (target && target.replyData && target.replyData.replies && target.replyData.replies.length > 0) {
                  showConfirm('已有回复', '该备忘录已有角色回复，是否追加？', async (confirmed) => {
                    if (confirmed) {
                      await generateDirectReply(charId, shared.content, targetId, charName);
                      await AiPhone.chat.writeHistory({ characterId: charId, role: 'assistant', content: '好呀，给你留了一条回复。' });
                      await AiPhone.chat.requestReply({ characterId: charId });
                    }
                    closeConfirm();
                  }, true);
                  return;
                }
                await generateDirectReply(charId, shared.content, targetId, charName);
                await AiPhone.chat.writeHistory({ characterId: charId, role: 'assistant', content: '好呀，给你留了一条回复。' });
                await AiPhone.chat.requestReply({ characterId: charId });
              } else {
                showToast('未能找到目标备忘录 ID');
              }
            } else {
              await AiPhone.chat.writeHistory({ characterId: charId, role: 'assistant', content: response });
              await AiPhone.chat.requestReply({ characterId: charId });
            }
            return;
          }

          if (isMemo) {
            const r = await AiPhone.ai.generate({
              characterId: charId,
              appTags: ['memo', 'special'],
              instruction: '用户想让你在备忘录里留一条言。用户消息：' + text + '\n请根据角色性格决定是否同意。如果同意，输出「同意」；如果拒绝，输出一句拒绝语。只输出内容。'
            });
            let response = r.text || '同意';
            response = cleanAI(response);
            if (response.includes('同意') || response.includes('好') || response.includes('可以')) {
              let content = text.replace(/留言/g, '').replace(/能|可以|能不能|给我/g, '').trim() || '（未指定内容）';
              // 用户话术里的分隔指令词 → [新文本框] 分隔符
              content = naturalToBlocks(content);
              const memo = await addMemo(content, false, null, 'special', { characterName: charName, source: 'invite', blocks: roleTextToBlocks(content) });
              if (memo) {
                memo.characterName = charName;
                await saveMemos();
                render();
                await AiPhone.chat.writeHistory({ characterId: charId, role: 'assistant', content: '好呀，给你留了一条言。' });
                await AiPhone.chat.requestReply({ characterId: charId });
                logInfo('LISTEN', '已留言');
              }
            } else {
              await AiPhone.chat.writeHistory({ characterId: charId, role: 'assistant', content: response });
              await AiPhone.chat.requestReply({ characterId: charId });
            }
            return;
          }
        } catch(e) {
          // 监听器失败只记日志，不弹错误框——避免打断用户（例如分享成功后的卡片消息）
          logWarn('LISTEN', e.message);
        }
      });
      logInfo('LISTEN', '监听已设置');
    } catch(e) {
      logWarn('LISTEN', '设置失败', e.message);
    }
  }

  async function generateDirectReply(charId, memoContent, targetId, charName) {
    try {
      const name = charName || '角色';
      const tgt = memos.find(m => m.id === targetId);
      const imgMsgs = tgt ? await getMemoImagesForAI(tgt) : [];
      const memoForAI = tgt ? getMemoContentForAI(tgt) : (memoContent || '');
      const result = await AiPhone.ai.generate({
        characterId: charId,
        appTags: ['memo', 'special'],
        messages: imgMsgs,
        instruction: '用户备忘录内容: ' + memoForAI + (imgMsgs.length ? '\n备忘录中还包含' + imgMsgs.length + '张图片，请结合图片内容一起理解。' : '') + '\n请生成一句角色回复，要求与备忘录内容相关。尽量简短（50字以内），只输出一句回复。'
      });
      let content = result.text || '好的，我看看。';
      content = cleanAI(content);
      if (!content) content = '好的，我看看。';
      const target = memos.find(m => m.id === targetId);
      if (target) {
        if (!target.replyData) target.replyData = { characterId: charId, characterName: name, replies: [] };
        const entry = {
          content: content,
          createdAt: new Date().toISOString(),
          isConfirmed: false,
          source: 'invite',
          memoryAppEventId: null,
          characterName: name,
          characterId: charId
        };
        target.replyData.replies.push(entry);
        await saveMemos();
        render();
        await pushEditHistory(targetId, target._title || '', target.content || '', target.blocks);
        const idx = target.replyData.replies.length - 1;
        openReplyDetail(targetId, idx);
        showToast('已生成回复');
      }
    } catch(e) { logWarn('GEN_REPLY', e.message); showToast('生成回复失败'); }
  }

  // ---- 工具注册 ----
  function registerTools() {
    try {
      // read-memo（v3 逻辑，保持不变）
      AiPhone.tools.handle('readMemoHandler', async (args) => {
        await ensureMemosLoaded();
        const q = args.query || '';
        let limit = args.limit || 0;
        const timeRange = args.timeRange || '';
        const favoritesOnly = args.favoritesOnly || false;
        const readAll = args.readAll || false;
        const ctx = args._context || {};
        let callerId = ctx.characterId || null;

        if (!callerId) {
          try {
            const session = await AiPhone.chat.getCurrentSession();
            if (session && session.characterId) {
              callerId = session.characterId;
            }
          } catch(e) {}
        }

        let userName = '用户';
        try {
          const profile = await AiPhone.user.getProfile();
          if (profile?.name) userName = profile.name;
        } catch(e) {}

        const isFriend = !dev.friendReadLimit && callerId && denseFriendId && String(callerId) === String(denseFriendId);

        let allList = memos.slice();

        if (favoritesOnly) {
          allList = allList.filter(m => m.favorite === true);
        }

        if (q.trim()) {
          const s = q.trim().toLowerCase();
          allList = allList.filter(m => m.content.toLowerCase().includes(s));
        }

        if (timeRange) {
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          if (timeRange.includes('今天')) {
            allList = allList.filter(m => new Date(m.createdAt) >= today);
          } else if (timeRange.includes('本周')) {
            const weekStart = new Date(today);
            weekStart.setDate(today.getDate() - today.getDay());
            allList = allList.filter(m => new Date(m.createdAt) >= weekStart);
          }
        }

        if (!readAll && allList.length > 10) {
          const favList = allList.filter(m => m.favorite);
          const normalList = allList.filter(m => !m.favorite);
          const result = [...favList];
          if (result.length < 10) {
            const need = 10 - result.length;
            const sortedNormal = normalList.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            result.push(...sortedNormal.slice(0, need));
          }
          allList = result;
        }

        if (limit > 0 && allList.length > limit) {
          allList = allList.slice(0, limit);
        }

        if (!allList.length) {
          return { result: '用户没有匹配的备忘录记录。' };
        }

        let resultText = '用户有以下备忘录记录：\n\n';
        for (let i = 0; i < allList.length; i++) {
          const m = allList[i];
          const isEncrypted = m.encrypted === true;
          const type = m.type || 'user';

          const isDaibi = type === 'daibi';

            resultText += '挂载回复\n';
            for (let j = 0; j < m.replyData.replies.length; j++) {
              const r = m.replyData.replies[j];
              const rCharName = r.characterName || '未知';
              const rCharId = r.characterId || null;
              const rIsSelf = callerId && rCharId && String(callerId) === String(rCharId);
              const rTime = formatTime(r.createdAt);
              if (rIsSelf) {
                resultText += `  - 回复${j+1} (${rTime})：作者：${rCharName}，内容：${r.content || ''}\n`;
              } else {
                resultText += `  - 回复${j+1} (${rTime})：作者：未知，内容：${r.content || ''}\n`;
              }
            }
          } else {
            resultText += '挂载回复：无\n';
          }
          resultText += '\n';
        }

        return { result: resultText };
      });

      // write-memo（仅 special / daibi）
      AiPhone.tools.handle('writeMemoHandler', async (args) => {
        await ensureMemosLoaded();
        const c = args.content || '';
        if (!c.trim()) return { result: '写入失败：内容不能为空' };

        const ctx = args._context || {};
        let charId = ctx.characterId || 'unknown';

        if (!charId || charId === 'unknown') {
          try {
            const session = await AiPhone.chat.getCurrentSession();
            if (session && session.characterId) {
              charId = session.characterId;
            }
          } catch(e) {}
        }

        let charName = args.characterName || null;
        if (!charName && charId && charId !== 'unknown') {
          try {
            const ch = await AiPhone.characters.get(charId);
            if (ch && ch.name) charName = ch.name;
          } catch(e) {
            logWarn('TOOL', '从上下文获取角色名失败', e.message);
          }
        }

        if (!charName) {
          const errorMsg = '写入失败：缺少角色名，请传入 characterName 参数';
          showError('角色名获取失败', errorMsg);
          return { result: errorMsg };
        }

        const type = args.type || 'daibi';
        if (type !== 'special' && type !== 'daibi') {
          return { result: '写入失败：type 参数必须为 special 或 daibi' };
        }

        if (type === 'special') {
          // 留言保持匿名（首页有"猜作者"玩法），不标 author；仍兼容自然分隔词
          const memo = await addMemo(c, false, null, 'special', { characterName: charName, source: 'invite', characterId: charId, blocks: roleTextToBlocks(naturalToBlocks(c)) });
          if (memo) { memo.characterName = charName; await saveMemos(); }
          render();
          return { result: '已成功写入角色留言：' + c.slice(0, 50) + (c.length > 50 ? '...' : '') };
        }

        // 代笔：整条都是角色所写，首页有「角色代笔」徽章标识来源，编辑器内不逐块标注"来自xx"
        const memo = await addMemo(c, false, null, 'daibi', { characterName: charName, source: 'invite', characterId: charId, blocks: roleTextToBlocks(naturalToBlocks(c)) });
        if (memo) { memo.characterName = charName; await saveMemos(); }
        render();
        return { result: '已成功写入角色代笔：' + c.slice(0, 50) + (c.length > 50 ? '...' : '') };
      });

      // write-reply
      AiPhone.tools.handle('writeReplyHandler', async (args) => {
        await ensureMemosLoaded();
        const c = args.content || '';
        if (!c.trim()) return { result: '回复失败：内容不能为空' };

        const targetId = args.targetMemoId || null;
        if (!targetId) return { result: '回复失败：缺少 targetMemoId 参数' };

        const target = memos.find(m => m.id === targetId);
        if (!target) return { result: '回复失败：目标备忘录不存在，targetMemoId=' + targetId };

        if (target.type !== 'user') {
          return { result: '该备忘录类型为[' + (target.type || '用户') + ']，不支持角色回复。角色会将备忘录的写入者当做你，可能产生不恰当的回复。' };
        }

        const ctx = args._context || {};
        let charId = ctx.characterId || 'unknown';

        if (!charId || charId === 'unknown') {
          try {
            const session = await AiPhone.chat.getCurrentSession();
            if (session && session.characterId) {
              charId = session.characterId;
            }
          } catch(e) {}
        }

        let charName = args.characterName || null;
        if (!charName && charId && charId !== 'unknown') {
          try {
            const ch = await AiPhone.characters.get(charId);
            if (ch && ch.name) charName = ch.name;
          } catch(e) {
            logWarn('TOOL', '从上下文获取角色名失败', e.message);
          }
        }

        if (!charName) {
          const errorMsg = '回复失败：缺少角色名，请传入 characterName 参数';
          showError('角色名获取失败', errorMsg);
          return { result: errorMsg };
        }

        if (!target.replyData) target.replyData = { characterId: charId, characterName: charName, replies: [] };
        const entry = {
          content: c,
          createdAt: new Date().toISOString(),
          isConfirmed: false,
          source: 'invite',
          memoryAppEventId: null,
          characterName: charName,
          characterId: charId
        };
        target.replyData.replies.push(entry);
        await saveMemos();
        render();
        await pushEditHistory(targetId, target._title || '', target.content || '', target.blocks);
        return { result: '已成功写入回复：' + c.slice(0, 50) + (c.length > 50 ? '...' : '') };
      });

      // dense-friend-tools
      AiPhone.tools.handle('denseFriendHandler', async (args) => {
        await ensureMemosLoaded();
        const action = args.action || '';
        const targetId = args.targetMemoId || null;
        const content = args.content || '';
        const ctx = args._context || {};
        let callerId = ctx.characterId || null;

        if (!callerId) {
          try {
            const session = await AiPhone.chat.getCurrentSession();
            if (session && session.characterId) {
              callerId = session.characterId;
            }
          } catch(e) {}
        }

        // 解析角色名（用于"来自xx"作者标记）
        let charName = args.characterName || null;
        if (!charName && callerId) {
          try {
            const ch = await AiPhone.characters.get(callerId);
            if (ch && ch.name) charName = ch.name;
          } catch(e) {}
        }
        if (!charName) charName = '角色';

        const cfg = await AiPhone.db.list('config', { limit: 30 });
        const friendCfg = cfg.find(c => c.id === 'denseFriend');
        const currentDenseFriendId = friendCfg ? friendCfg.data : null;

        if (!currentDenseFriendId) {
          throw new Error('当前未绑定密友，请先在备忘录中绑定');
        }
        if (!callerId) {
          throw new Error('无法识别您的身份，请确保在聊天中调用此工具');
        }
        if (String(callerId) !== String(currentDenseFriendId)) {
          throw new Error('只有密友可以执行此操作');
        }

        const memo = memos.find(m => m.id === targetId);
        if (!memo) {
          return { result: '操作失败：未找到目标备忘录' };
        }
        if (memo.locked) {
          return { result: '操作失败：该备忘录已锁定' };
        }

        switch (action) {
          case 'delete': {
            recycleBin.unshift({
              id: memo.id,
              data: JSON.parse(JSON.stringify(memo)),
              deletedAt: new Date().toISOString()
            });
            if (recycleBin.length > RECYCLE_LIMIT) {
              recycleBin = recycleBin.slice(0, RECYCLE_LIMIT);
            }
            const idx = memos.findIndex(m => m.id === targetId);
            if (idx !== -1) memos.splice(idx, 1);
            await saveMemos();
            render();
            return { result: '已成功删除备忘录' };
          }
          case 'edit': {
            if (!content || !content.trim()) {
              return { result: '编辑失败：内容不能为空' };
            }
            if (memo.locked) { return { result: '操作失败：该备忘录已锁定' }; }
            // 编辑时同步重算 blocks，保证首页 content 与编辑器 blocks 一致
            const oldBlocks = (Array.isArray(memo.blocks) && memo.blocks.length) ? memo.blocks : contentToBlocks(memo.content || '');
            // 插入指令一：锚点式「跟在xx后面 / 在xx后面 / 跟xx后面 / xx之后」
            const insertMatch = content.match(/(?:跟在?|在|跟)([^，。；;、\n]{1,20}?)\s*(?:后面|之后)/);
            // 局部替换指令：「把XX改成YY / 将XX编辑为YY / XX替换成YY」等，
            // 只改包含 XX 的文本块，保留该块原有 author 标记（有则保留、无则不加）
            const replaceMatch = !insertMatch && content.match(/(?:把|将)([^，。；;、\n]{1,30}?)(?:改(?:成|为)|编辑(?:成|为)?|替换(?:成|为)?|变为|变成)([^，。；;、\n]{1,50})/);
            // 插入指令二：无锚点但明确表达"新建文本框/插入/分段"（追加到末尾）
            const appendInsert = !insertMatch && !replaceMatch && /(新建(?:一个)?文本框|新文本框|插入(?:一个)?(?:文本框)?|加(?:一个)?(?:新)?文本框|隔断|分块|分框|另起(?:一段)?|新起(?:一段)?|再写(?:一段)?|再记(?:一段)?)/.test(content);
            let newBlocks;
            if (insertMatch) {
              // 锚点插入：在旧文本块中找锚点，其后插入新文本框；找不到锚点则追加末尾。
              // 只有"插入"产生的新文本框才带 author（「来自xx」样式），这是密友协作标注。
              const anchor = insertMatch[1].replace(/^我的/, '').trim();
              const rest = naturalToBlocks(content.replace(insertMatch[0], ''));
              const addBlocks = roleTextToBlocks(rest).map(b => (b.type === 'text' ? { ...b, author: charName } : b));
              if (!addBlocks.length) return { result: '编辑失败：请在"跟在xx后面"后补充要加入的内容' };
              let inserted = false;
              const out = [];
              for (const b of oldBlocks) {
                out.push(b);
                if (!inserted && b.type === 'text' && anchor && (b.text || '').includes(anchor)) {
                  out.push(...addBlocks);
                  inserted = true;
                }
              }
              if (!inserted) out.push(...addBlocks);
              newBlocks = out;
            } else if (replaceMatch) {
              // 局部替换：找到包含 XX 的文本块，把其中的 XX 替换为 YY。
              // 默认改第 1 个匹配块；用户说「把第二个XX改成YY」时按序数改第 N 个匹配块。
              // 保留原块对象（author 标记有则保留、无则不加），其余块不动，绝不新增框。
              let rawOld = (replaceMatch[1] || '').replace(/^我的/, '').trim();
              const newStr = (replaceMatch[2] || '').trim();
              const ordMatch = rawOld.match(/^第([一二三四五六七八九十\d]+)个/);
              const ord = ordMatch ? parseOrd(ordMatch[1]) : 1;
              rawOld = rawOld.replace(/^(?:第[一二三四五六七八九十\d]+个|前一个|上一个|上面(?:那个|这个)|下面(?:那个|这个)|刚才(?:那个|这个)|之前(?:那个|这个)|那个|这个)/, '').trim();
              const oldStr = rawOld;
              if (!oldStr) return { result: '编辑失败：未识别到要修改的原文' };
              if (!newStr) return { result: '编辑失败：未识别到修改后的内容' };
              const hitIdx = [];
              oldBlocks.forEach((b, bi) => {
                if (b.type === 'text' && (b.text || '').includes(oldStr)) hitIdx.push(bi);
              });
              if (!hitIdx.length) return { result: '编辑失败：未找到包含「' + oldStr + '」的内容' };
              const targetBi = hitIdx[Math.min(ord, hitIdx.length) - 1];
              const out = oldBlocks.map((b, bi) => {
                if (bi === targetBi && b.type === 'text') {
                  return { ...b, text: (b.text || '').replace(oldStr, newStr) };
                }
                return b;
              });
              newBlocks = out;
            } else if (appendInsert) {
              // 追加插入：旧块全部保留，新内容作为新文本框追加到末尾，带「来自xx」样式
              const textBlocks = roleTextToBlocks(naturalToBlocks(content)).map(b => (b.type === 'text' ? { ...b, author: charName } : b));
              if (!textBlocks.length) return { result: '编辑失败：未识别到要插入的内容' };
              newBlocks = [...oldBlocks, ...textBlocks];
            } else {
              // 整段重写（无插入意图）：把带 [新文本框]/[图片] 标记的内容解析回 blocks，
              // 图片从旧 blocks 按顺序恢复 ref（角色保留 [图片] 标记则图片原样保留，删掉则删图）。
              // 这是"编辑/改写"，文本块不带「来自xx」样式（样式只用于插入动作）。
              newBlocks = structuredToBlocks(naturalToBlocks(content), oldBlocks);
            }
            memo.blocks = newBlocks;
            memo.content = blocksToContent(newBlocks);
            await saveMemos();
            render();
            await pushEditHistory(targetId, memo._title || '', memo.content || '', newBlocks);
            return { result: '已成功编辑备忘录' };
          }
          case 'favorite': {
            memo.favorite = !memo.favorite;
            await saveMemos();
            render();
            return { result: memo.favorite ? '已收藏备忘录' : '已取消收藏' };
          }
          default:
            return { result: '操作失败：未知操作' };
        }
      });

      logInfo('TOOL', '工具注册成功');
    } catch(e) { logWarn('TOOL', '注册失败', e.message); }
  }

  // ---- 初始化 ----
  async function init() {
    if (typeof AiPhone === 'undefined') {
      document.body.innerHTML = '<div style="padding:40px;text-align:center;color:red;">错误：未找到 AiPhone SDK</div>';
      return;
    }

    registerTools();
    await loadDevFromDB();
    applyCustomCss();
    await loadEditHistory();

    // ---- 缩小版编辑器事件 ----
    miniEditBack.addEventListener('click', confirmBackFromEditor);
    miniEditSave.addEventListener('click', () => {
      saveDraftToStorage();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    });
    miniEditUndo.addEventListener('click', editUndo);
    miniEditRedo.addEventListener('click', editRedo);
    // 标题撤销：在值改变前（beforeinput）记录旧状态，undo 一次即可撤销最近输入
    miniEditTitle.addEventListener('beforeinput', pushEditSnapshot);

    // blocks 容器事件委托（一次性绑定）
    setupBlocksDelegate();
    // 说明：不再对图片块做 touchstart preventDefault——
    // 它会锁死"手指按在图片上时"的滚动。防浏览器"保存图片"菜单
    // 由 CSS（-webkit-touch-callout:none / user-select:none）与 contextmenu 拦截负责，
    // 文本框聚焦编辑保持浏览器原生行为，滚动全程正常。

    // 右下角 + 按钮：展开「新增文本框 / 添加图片」
    editFabAdd.addEventListener('click', (e) => {
      e.stopPropagation();
      editFabMenu.classList.toggle('hidden');
    });
    editAddText.addEventListener('click', () => { editFabMenu.classList.add('hidden'); addTextBlock(); });
    editAddImage.addEventListener('click', () => { editFabMenu.classList.add('hidden'); addImageBlock(); });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.edit-fab-wrap')) editFabMenu.classList.add('hidden');
    });

    // 自动保存草稿：页面隐藏（切到小手机桌面/切走网页/关浏览器）时保存，保留编辑记录
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && miniEditorState.isOpen) {
        saveDraftToStorage();
      }
    });

    // ---- 全局事件 ----
    gearBtn.addEventListener('click', () => { applyDevUI(); devOverlay.classList.remove('hidden'); });
    devClose.addEventListener('click', () => devOverlay.classList.add('hidden'));
    devConfirm.addEventListener('click', () => { readDev(); applyCustomCss(); devOverlay.classList.add('hidden'); showToast('设置已生效'); });

    $('devForceProbMode').addEventListener('change', function() { $('devForceProb').disabled = false; });
    $('devForceCondMode').addEventListener('change', function() { $('devForceProb').disabled = true; });
    $('devResetDefaults').addEventListener('click', resetDevDefaults);

    $('devSpecialGen').addEventListener('click', async () => {
      devOverlay.classList.add('hidden');
      showToast('正在生成角色留言...', true);
      const n = await genSpecial(1);
      if (n > 0) { showGenNotification(); render(); }
    });
    $('devReplyGen').addEventListener('click', async () => {
      devOverlay.classList.add('hidden');
      showToast('正在生成角色回复...', true);
      const n = await genReply(1);
      if (n > 0) { showGenNotification(); render(); }
    });

    // 指定角色：留言 / 回复
    $('devSpecialCharsBtn').addEventListener('click', () => {
      openCharPicker('选择留言角色', dev.specialChars, (ids) => {
        dev.specialChars = ids;
        saveDevToDB();
        updateCharLabel('devSpecialCharsLabel', ids);
        showToast('留言角色已更新');
      });
    });
    $('devSpecialCharsClear').addEventListener('click', () => {
      dev.specialChars = [];
      saveDevToDB();
      updateCharLabel('devSpecialCharsLabel', []);
      showToast('已清空（使用全部角色）');
    });
    $('devReplyCharsBtn').addEventListener('click', () => {
      openCharPicker('选择回复角色', dev.replyChars, (ids) => {
        dev.replyChars = ids;
        saveDevToDB();
        updateCharLabel('devReplyCharsLabel', ids);
        showToast('回复角色已更新');
      });
    });
    $('devReplyCharsClear').addEventListener('click', () => {
      dev.replyChars = [];
      saveDevToDB();
      updateCharLabel('devReplyCharsLabel', []);
      showToast('已清空（使用全部角色）');
    });

    // 自定义 CSS：清空
    $('devCssClear').addEventListener('click', () => {
      $('devCustomCss').value = '';
      dev.customCss = '';
      applyCustomCss();
      saveDevToDB();
      showToast('已清空自定义 CSS');
    });

    await loadMemos();
    await restoreDraft();

    friendBadge.addEventListener('click', openFriendSelect);
    headerRecycle.addEventListener('click', openRecycleBin);

    fabAdd.addEventListener('click', () => openMiniEditor(null, true));

    importExportBtn.addEventListener('click', openImport);
    importClose.addEventListener('click', () => importModal.classList.add('hidden'));
    getJsonFormatBtn.addEventListener('click', copyJsonTemplate);
    importFileBtn.addEventListener('click', triggerBatch);
    fileInput.addEventListener('change', handleFile);
    imageFileInput.addEventListener('change', handleImageFile);
    batchExportBtn.addEventListener('click', batchExport);

    confirmNo.addEventListener('click', () => { if (confirmCb) confirmCb(false); closeConfirm(); });
    confirmYes.addEventListener('click', () => { if (confirmCb) confirmCb(true); closeConfirm(); });

    const tabButtons = document.querySelectorAll('.tabs button');
    tabButtons.forEach(btn => btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      tabButtons.forEach(b => b.classList.toggle('active', b === btn));
      render();
    }));

    searchInput.addEventListener('input', function() {
      searchQuery = this.value;
      render();
    });

    setupListener();

    logInfo('INIT', '备忘录 APP 已启动');
    console.log('✅ v4 最终版已加载');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  window.__debug = { memos: () => memos, add: addMemo, load: loadMemos, save: saveMemos, deleteAll: async () => { memos = []; await saveMemos(); render(); showToast('已清空'); }, dev: () => dev, recycle: () => recycleBin, friend: () => denseFriendId };
})();
</script>
</body>
